        async function initSupabase() {
            try {
                if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('PASTE_')) {
                    console.warn('Supabase URL / Anon Key belum lengkap. Sistem berjalan dalam mod tempatan.');
                    supabaseEnabled = false;
                    return;
                }

                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                });

                supabaseEnabled = true;
                await fetchAllDataFromSupabase();
                console.log('Supabase initialized successfully');
            } catch (e) {
                supabaseEnabled = false;
                console.error('Supabase connection error:', e);
            }
        }

        async function fetchAllDataFromSupabase() {
            if (!supabaseEnabled || !supabase) return;
            try {
                const { data: studentRows, error: studentError } = await supabase
                    .from('students')
                    .select('id,nama,ic,kelas')
                    .order('kelas', { ascending: true })
                    .order('nama', { ascending: true });

                if (studentRows && studentRows.length > 0) {
                    students.length = 0;
                    studentRows.forEach(row => {
                        students.push({
                            id: row.id,
                            nama: row.nama,
                            ic: row.ic,
                            kelas: row.kelas
                        });
                    });

                    .from('marks')
                    .select('key,value');
                if (markError) throw markError;
                if (markRows) {
                    Object.keys(studentMarks).forEach(k => delete studentMarks[k]);
                    markRows.forEach(row => {
                        if (row.key) studentMarks[row.key] = row.value;
                    });
                }

                const { data: pbdRows, error: pbdError } = await supabase
                    .from('pbd')
                    .select('key,value');
                if (pbdError) throw pbdError;
                if (pbdRows) {
                    Object.keys(studentPBD).forEach(k => delete studentPBD[k]);
                    pbdRows.forEach(row => {
                        if (row.key) studentPBD[row.key] = row.value;
                    });
                }
            } catch (e) {
                console.error('Error retrieving Supabase data:', e);
                showToast('Gagal ambil data Supabase. Semak RLS atau jadual.', 'danger');
            }
        }

        // --- PENGIRAAN STATISTIK PBD AUTOMATIK ---
        function calculatePBDStatsForYear(yearNum) {
            const result = {};
            const activeStudents = students.filter(s => s.kelas.startsWith(yearNum + ' '));

            baseSubjects.forEach(sub => {
                result[sub] = {
                    'AL-KHAWARIZMI': { TP1: 0, TP2: 0, TP3: 0, TP4: 0, TP5: 0, TP6: 0, Total: 0 },
                    'AR-RAZI': { TP1: 0, TP2: 0, TP3: 0, TP4: 0, TP5: 0, TP6: 0, Total: 0 },
                    'JUMLAH': { TP1: 0, TP2: 0, TP3: 0, TP4: 0, TP5: 0, TP6: 0, Total: 0 }
                };

                activeStudents.forEach(s => {
                    const classKey = s.kelas.includes('AL-KHAWARIZMI') ? 'AL-KHAWARIZMI' : 'AR-RAZI';
                    const key = `${s.id}_${analysisSelectedAcademicYearPBD}_${analysisSelectedAssessment}_${sub}`;
                    const tp = studentPBD[key];

                    if (tp && ['TP1', 'TP2', 'TP3', 'TP4', 'TP5', 'TP6'].includes(tp)) {
                        result[sub][classKey][tp]++;
                        result[sub][classKey].Total++;
                        result[sub]['JUMLAH'][tp]++;
                        result[sub]['JUMLAH'].Total++;
                    }
                });
            });

            return result;
        }

        // --- FUNGSI JANA RUMUSAN AUTOMATIK ---
        function generateAutomaticSummary(stats) {
            let bestSubject = '-';
            let bestScore = -1;
            let weakestSubject = '-';
            let weakestScore = 9999;

            baseSubjects.forEach(sub => {
                const data = stats[sub]['JUMLAH'];
                if (data.Total > 0) {
                    const menguasai = data.TP3 + data.TP4 + data.TP5 + data.TP6;
                    const pct = (menguasai / data.Total) * 100;
                    if (pct > bestScore) {
                        bestScore = pct;
                        bestSubject = sub;
                    }
                    if (pct < weakestScore) {
                        weakestScore = pct;
                        weakestSubject = sub;
                    }
                }
            });

            if (bestScore === -1) bestSubject = "Tiada Data";
            if (weakestScore === 9999) weakestSubject = "Tiada Data";

            return {
                bestSubject,
                weakestSubject,
                bestClass: "1 AR-RAZI",
                interventionClass: "1 AL-KHAWARIZMI",
                suggestions: [
                    "Menjalankan bimbingan berfokus (PLC) bagi subjek " + (weakestSubject !== "Tiada Data" ? weakestSubject : "yang dikenal pasti lemah") + ".",
                    "Memantapkan pelaksanaan aktiviti interaktif dan intervensi dalam bilik darjah.",
                    "Sesi perkongsian amalan terbaik di antara guru pentaksir subjek utama."
                ]
            };
        }

        // --- GRADES MATH ---
        function calculateUASAGrade(score) {
            if (score === null || score === undefined || score === '') {
                return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
            }
            const num = parseFloat(score);
            if (num >= 82 && num <= 100) return { grade: 'A', color: 'text-emerald-700 bg-emerald-50 border-emerald-200', label: 'CEMERLANG' };
            if (num >= 66 && num <= 81) return { grade: 'B', color: 'text-cyan-700 bg-cyan-50 border-cyan-200', label: 'KEPUJIAN' };
            if (num >= 50 && num <= 65) return { grade: 'C', color: 'text-amber-700 bg-amber-50 border-amber-200', label: 'MEMUASKAN' };
            if (num >= 35 && num <= 49) return { grade: 'D', color: 'text-orange-700 bg-orange-50 border-orange-200', label: 'MENCAPAI TAHAP MINIMUM' };
            if (num >= 1 && num <= 34) return { grade: 'E', color: 'text-rose-700 bg-rose-50 border-rose-200', label: 'BELUM MENCAPAI TAHAP MINIMUM' };
            if (num === 0) return { grade: 'F', color: 'text-red-700 bg-red-100 border-red-300', label: 'TIDAK MENGUASAI' };
            return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
        }

        // --- SUBMIT AND PERSIST ASSESSMENT ---
        async function saveMarks(silent = false) {
            const rows = document.querySelectorAll('.student-row');
            let successCount = 0;
            const markRows = [];
            const pbdRows = [];

            for (const row of rows) {
                const sId = row.getAttribute('data-id');
                const markInput = row.querySelector('.mark-input');
                const pbdSelect = row.querySelector('.pbd-select');
                const key = `${sId}_${selectedYear}_${selectedAssessment}_${selectedSubject}`;
                const keyInfo = parseKey(key);

                if (markInput) {
                    const markVal = markInput.value.trim();

                    if (markVal === '') {
                        delete studentMarks[key];
                    } else {
                        const num = parseFloat(markVal);
                        if (!isNaN(num) && num >= 0 && num <= 100) {
                            studentMarks[key] = num;
                            markRows.push({
                                key,
                                student_id: String(keyInfo.student_id),
                                tahun: keyInfo.tahun,
                                assessment: keyInfo.assessment,
                                subject: keyInfo.subject,
                                value: num,
                                teacher_email: currentUser ? currentUser.email : null,
                                updated_at: new Date().toISOString()
                            });
                            successCount++;
                        }
                    }

                    if (pbdSelect) {
                        const pbdVal = pbdSelect.value;
                        if (pbdVal) {
                            studentPBD[key] = pbdVal;
                            pbdRows.push({
                                key,
                                student_id: String(keyInfo.student_id),
                                tahun: keyInfo.tahun,
                                assessment: keyInfo.assessment,
                                subject: keyInfo.subject,
                                value: pbdVal,
                                teacher_email: currentUser ? currentUser.email : null,
                                updated_at: new Date().toISOString()
                            });
                        } else {
                            delete studentPBD[key];
                        }
                    }
                }
            }

            await persistMarksBulkToSupabase(markRows, pbdRows);

            if (!silent) {
                showToast(`Selesai menyimpan ${successCount} rekod prestasi ke Supabase.`, 'success');
            }
            renderPage();
        }

        // --- CSV LOADING AND PROCESSING ---
        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = text.split('\n');
                tempUploadedStudents = [];

                for (let i = 1; i < rows.length; i++) {
                    const columns = rows[i].split(',');
                    if (columns.length >= 3) {
                        const nama = columns[0].trim().toUpperCase();
                        const ic = columns[1].trim();
                        const kelas = columns[2].trim().toUpperCase();

                        if (nama && ic && kelas) {
                            tempUploadedStudents.push({ nama, ic, kelas });
                        }
                    }
                }

                const infoBox = document.getElementById('csv-preview-info');
                if (infoBox) {
                    infoBox.innerText = `Menjumpai ${tempUploadedStudents.length} murid sedia untuk diimport.`;
                    infoBox.classList.remove('hidden');
                }
                showToast(`Selesai memuat fail. Sila klik SIMPAN untuk memasukkannya ke sistem.`, 'info');
            };
            reader.readAsText(file);
        }

        async function saveCSVData() {
            if (tempUploadedStudents.length === 0) {
                showToast('Tiada data fail CSV dikesan. Sila pilih fail terlebih dahulu.', 'warning');
                return;
            }

            let importCount = 0;
            const startId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;

            for (let i = 0; i < tempUploadedStudents.length; i++) {
                const row = tempUploadedStudents[i];
                const exists = students.some(s => s.ic === row.ic);
                
                if (!exists) {
                    const studentObj = {
                        id: startId + importCount,
                        nama: row.nama,
                        ic: row.ic,
                        kelas: row.kelas
                    };
                    students.push(studentObj);
                    importCount++;
                }
            }

            const newStudentsForUpload = students.slice(students.length - importCount);
            await persistStudentsBulkToSupabase(newStudentsForUpload);

            tempUploadedStudents = [];
            const infoBox = document.getElementById('csv-preview-info');
            if (infoBox) {
                infoBox.classList.add('hidden');
            }

        // --- MANUAL REGISTRATION ---
        function handleManualRegisterSubmit(event) {
            event.preventDefault();
            const namaInput = document.getElementById('admin-reg-nama');
            const icInput = document.getElementById('admin-reg-ic');
            const kelasSelect = document.getElementById('admin-reg-kelas');

            const nama = namaInput.value.trim().toUpperCase();
            const ic = icInput.value.trim();
            const kelas = kelasSelect.value;

            if (!nama || !ic || !kelas) {
                showToast('Sila isikan semua butiran pendaftaran murid.', 'warning');
                return;
            }

            const exists = students.some(s => s.ic === ic);
            if (exists) {
                showToast('No. Kad Pengenalan ini telah berdaftar di dalam sistem.', 'danger');
                return;
            }

            pendingRegistrationData = { nama, ic, kelas };
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        async function closeConfirmModal(isConfirmed) {
            document.getElementById('confirm-modal').classList.add('hidden');
            
            if (isConfirmed && pendingRegistrationData) {
                const { nama, ic, kelas } = pendingRegistrationData;
                const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
                const newStudent = { id: newId, nama, ic, kelas };
                
                students.push(newStudent);
                await persistStudentToSupabase(newStudent);

                showToast('Nama murid berjaya disimpan ke sistem & Supabase.', 'success');

                document.getElementById('admin-reg-nama').value = '';
                document.getElementById('admin-reg-ic').value = '';
                pendingRegistrationData = null;
                renderPage();
            }
        }

        async function deleteStudent(id) {
            const index = students.findIndex(s => s.id == id);
            if (index !== -1) {
                const targetName = students[index].nama;
                students.splice(index, 1);
                await deleteStudentFromSupabase(id);
                showToast(`Murid ${targetName} berjaya dipadamkan.`, 'info');
                renderPage();
            }
        }

                            <div class="bg-emerald-600 text-white w-10 h-10 rounded-full flex items-center justify-center font-extrabold text-sm mb-2">${student.nama.charAt(0)}</div>
                            <h4 class="font-bold text-slate-800 text-xs">${student.nama}</h4>
                            <p class="text-[10px] text-slate-500 font-semibold">${student.ic}</p>
                            <p class="text-[10px] text-emerald-700 font-extrabold bg-emerald-50 inline-block px-2.5 py-0.5 rounded-full">${student.kelas}</p>
                        </div>
                    </div>

                    <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-emerald-100 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-800 text-sm">Profil Akademik Pentaksiran UASA & PBD</h3>
                        <div class="overflow-y-auto max-h-[300px] border border-slate-100 rounded-2xl">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-100 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                                        <th class="p-3">Matapelajaran</th>
                                        <th class="p-3 text-center">Markah</th>
                                        <th class="p-3 text-center">Gred</th>
                                        <th class="p-3 text-center">PBD TP</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${subjectsToUse.map(sub => {
                                        const key = `${student.id}_${selectedYear}_${analysisSelectedAssessment}_${sub}`;
                                        const score = studentMarks[key];
                                        const pbdVal = studentPBD[key] || '-';
                                        const gradeRes = calculateUASAGrade(score);

                                        return `
                                            <tr>
                                                <td class="p-3 font-bold text-slate-700">${sub}</td>
                                                <td class="p-3 text-center font-bold text-slate-800">${score !== undefined ? score + '%' : '-'}</td>
                                                <td class="p-3 text-center">
                                                    <span class="inline-block px-2 py-0.5 rounded-full font-bold text-[9px] border ${gradeRes.color}">${gradeRes.grade}</span>
                                                </td>
                                                <td class="p-3 text-center"><span class="font-extrabold text-teal-600 bg-teal-50 px-2.5 py-0.5 rounded-full text-[9px]">${pbdVal}</span></td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- PERFORMANCE / RENDER FOR PBD RINGKASAN ---
        function renderAnalysisPBD() {
            return `
                <div class="bg-white p-6 rounded-2xl border border-emerald-100 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-sm">Ringkasan Analisis Tahap Penguasaan (TP) PBD</h3>
                    <p class="text-xs text-slate-500 font-medium">Berdasarkan data pentaksiran yang disimpan, berikut adalah statistik purata pencapaian TP bagi kelas ${selectedClass}:</p>
                    <div class="grid grid-cols-2 md:grid-cols-6 gap-3 pt-3">
                        ${['TP1','TP2','TP3','TP4','TP5','TP6'].map((tp, idx) => {
                            const count = Object.values(studentPBD).filter(v => v === tp).length;
                            return `
                                <div class="p-4 border border-slate-100/80 bg-slate-50/30 rounded-2xl text-center space-y-1">
                                    <span class="text-xs font-bold text-emerald-600">${tp}</span>
                                    <h4 class="text-xl font-black text-slate-800">${count}</h4>
                                    <p class="text-[9px] text-slate-400 font-bold uppercase">Subjek Murid</p>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // --- WINDOW BOOTSTRAP ---
        window.onload = function() {
            initSupabase();
            lucide.createIcons();
            renderPage();
        };
    </script>
    <script>
   (function() {
    'use strict';

    // 1. PENGURUSAN KLIK KANAN (CONTEXT MENU)
    document.addEventListener('contextmenu', function(e) {
        // Hanya benarkan klik kanan jika berada di dalam elemen '.dalam-sistem'
        if (e.target.closest('.dalam-sistem')) {
            return true; 
        } else {
            e.preventDefault(); // Lock bahagian lain secara senyap
        }
    });

    // 2. PENGURUSAN PINTASAN PAPAN KEKUNCI (KEYBOARD)
    document.addEventListener('keydown', function(e) {
        const isDalamSistem = e.target.closest('.dalam-sistem');

        // LOCK fungsi salin (Ctrl+C / Ctrl+X) jika pengguna berada di LUAR sistem
        if (!isDalamSistem && (e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'x')) {
            e.preventDefault();
            return false;
        }

        // LOCK GLOBAL (Sentiasa sekat Inspect Element & View Source di mana-mana bahagian pun)
        if ((e.ctrlKey || e.metaKey) && e.key === 'u') { // Ctrl+U (View Source)
            e.preventDefault();
            return false;
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 's') { // Ctrl+S (Save Page)
            e.preventDefault();
            return false;
        }
        if ( // F12 & Ctrl+Shift+I/J/C (Inspect Element)
            e.key === 'F12' || 
            ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))
        ) {
            e.preventDefault();
            return false;
        }
    });

    // 3. ANTI-DEBUGGER (Lock Inspect Element daripada diceroboh melalui menu browser)
    function antiDebug(i) {
        if (("" + i / i).length !== 1 || i % 20 === 0) {
            (function() {}).constructor("debugger")();
        } else {
            (function() {}).constructor("debugger")();
        }
        antiDebug(++i);
    }
    try {
        setInterval(function() {
            antiDebug(0);
        }, 50);
    } catch (e) {}

})();
    </script>    
</body>
