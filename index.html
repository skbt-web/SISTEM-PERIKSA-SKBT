        function getAnalysisMarkValue(studentId, year, assessment, subject) {
            const key = `${studentId}_${year}_${assessment}_${subject}`;
            if (Object.prototype.hasOwnProperty.call(studentMarks, key)) return studentMarks[key];
            const row = (markStatusRows || []).find(r =>
                String(r.student_id) === String(studentId) &&
                String(r.tahun) === String(year) &&
                String(r.assessment) === String(assessment) &&
                String(r.subject) === String(subject)
            );
            return row ? row.value : '';
        }

        function getAnalysisPBDValue(studentId, year, assessment, subject) {
            const key = `${studentId}_${year}_${assessment}_${subject}`;
            if (Object.prototype.hasOwnProperty.call(studentPBD, key)) return studentPBD[key];
            const row = (pbdStatusRows || []).find(r =>
                String(r.student_id) === String(studentId) &&
                String(r.tahun) === String(year) &&
                String(r.assessment) === String(assessment) &&
                String(r.subject) === String(subject)
            );
            return row ? row.value : '';
        }

        function normalizeAnalysisMark(raw) {
            const str = String(raw ?? '').trim().toUpperCase();
            const absent = ['TH', 'TIDAK HADIR', 'ABSENT', 'T'].includes(str);
            if (absent) return { raw, absent: true, hasMark: false, value: null };
            if (str === '') return { raw, absent: false, hasMark: false, value: null };
            const num = Number(str);
            return Number.isFinite(num) && num >= 0 && num <= 100
                ? { raw, absent: false, hasMark: true, value: num }
                : { raw, absent: false, hasMark: false, value: null };
        }

        function medianOf(values) {
            if (!values.length) return 0;
            const sorted = [...values].sort((a,b) => a-b);
            const mid = Math.floor(sorted.length / 2);
            return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        }

        function analysisGrade(score) {
            return calculateUASAGrade(score).grade;
        }

        function getPreviousAssessmentName(current) {
            const idx = assessments.indexOf(current);
            return idx > 0 ? assessments[idx - 1] : '';
        }

        function buildTeacherAnalysisDataset(filters) {
            const roster = getStudentsByExactClass(filters.kelas);
            const prevAssessment = getPreviousAssessmentName(filters.assessment);
            const rows = roster.map(student => {
                const markObj = normalizeAnalysisMark(getAnalysisMarkValue(student.id, filters.year, filters.assessment, filters.subject));
                const pbd = String(getAnalysisPBDValue(student.id, filters.year, filters.assessment, filters.subject) || '').toUpperCase();
                const prevObj = prevAssessment
                    ? normalizeAnalysisMark(getAnalysisMarkValue(student.id, filters.year, prevAssessment, filters.subject))
                    : { hasMark: false, value: null };
                const grade = markObj.hasMark ? analysisGrade(markObj.value) : '-';
                const pass = markObj.hasMark && markObj.value >= 35;
                const fail = markObj.hasMark && markObj.value < 35;
                const almostPass = markObj.hasMark && markObj.value >= 30 && markObj.value < 35;
                const declining = markObj.hasMark && prevObj.hasMark && markObj.value < prevObj.value;
                const lowTP = ['TP1','TP2'].includes(pbd);
                const noMark = !markObj.hasMark && !markObj.absent;
                const noPBD = !pbd;
                let weakness = '-';
                let intervention = '-';
                if (noMark) { weakness = 'Markah belum dimasukkan'; intervention = 'Semak kehadiran dan lengkapkan pentaksiran.'; }
                else if (markObj.absent) { weakness = 'Tidak hadir pentaksiran'; intervention = 'Jadualkan pentaksiran gantian.'; }
                else if (fail) { weakness = 'Belum mencapai tahap minimum'; intervention = 'Bimbingan berfokus, latihan asas dan pemantauan mingguan.'; }
                else if (almostPass) { weakness = 'Hampir mencapai tahap minimum'; intervention = 'Latihan pengukuhan topik kritikal dan bimbingan kumpulan kecil.'; }
                else if (declining) { weakness = `Markah menurun ${Math.abs(markObj.value - prevObj.value).toFixed(0)} mata`; intervention = 'Analisis item, pemulihan topik dan semakan kemajuan.'; }
                else if (lowTP) { weakness = `${pbd} memerlukan pengukuhan`; intervention = 'Aktiviti berperingkat, bahan konkrit dan evidens PBD tambahan.'; }
                else if (noPBD) { weakness = 'PBD belum direkod'; intervention = 'Lengkapkan evidens dan tahap penguasaan PBD.'; }
                return { student, markObj, pbd, prevObj, grade, pass, fail, almostPass, declining, lowTP, noMark, noPBD, weakness, intervention };
            });

            const numeric = rows.filter(r => r.markObj.hasMark).map(r => r.markObj.value);
            const gradeCounts = { A:0, B:0, C:0, D:0, E:0, F:0 };
            const tpCounts = { TP1:0, TP2:0, TP3:0, TP4:0, TP5:0, TP6:0 };
            rows.forEach(r => {
                if (gradeCounts[r.grade] !== undefined) gradeCounts[r.grade]++;
                if (tpCounts[r.pbd] !== undefined) tpCounts[r.pbd]++;
            });
            const passCount = rows.filter(r => r.pass).length;
            const failCount = rows.filter(r => r.fail).length;
            const attended = numeric.length;
            const absent = rows.filter(r => r.markObj.absent).length;
            const average = numeric.length ? numeric.reduce((a,b)=>a+b,0)/numeric.length : 0;
            return {
                rows, numeric, gradeCounts, tpCounts,
                stats: {
                    total: rows.length,
                    attended,
                    absent,
                    passCount,
                    failCount,
                    passPct: attended ? passCount/attended*100 : 0,
                    failPct: attended ? failCount/attended*100 : 0,
                    highest: numeric.length ? Math.max(...numeric) : 0,
                    lowest: numeric.length ? Math.min(...numeric) : 0,
                    average,
                    median: medianOf(numeric)
                }
            };
        }

        function getInterventionStatusMap() {
            try { return JSON.parse(localStorage.getItem(TEACHER_INTERVENTION_STATUS_KEY) || '{}'); }

        }

        function saveTeacherInterventionStatus(key, value) {
            const map = getInterventionStatusMap();

        function getTeacherInterventionRows(dataset) {
            const seen = new Set();
            const out = [];
            dataset.rows.forEach(r => {
                const categories = [];
                if (r.fail) categories.push('Murid Gagal');
                if (r.almostPass) categories.push('Hampir Lulus');
                if (r.declining) categories.push('Markah Menurun');
                if (r.lowTP) categories.push('TP1 / TP2');
                if (r.noMark) categories.push('Belum Ada Markah');
                if (r.noPBD) categories.push('Belum Ada PBD');
                if (!categories.length) return;
                const key = String(r.student.id);
                if (seen.has(key)) return;
                seen.add(key);
                out.push({ ...r, categories });
            });
            return out;
        }

        function getClassAverageForAnalysis(kelas, filters) {
            const roster = getStudentsByExactClass(kelas);
            const vals = roster.map(s=>normalizeAnalysisMark(getAnalysisMarkValue(s.id,filters.year,filters.assessment,filters.subject))).filter(x=>x.hasMark).map(x=>x.value);
            return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
        }

        function getAssessmentAverageForAnalysis(assessment, filters) {
            const roster = getStudentsByExactClass(filters.kelas);
            const vals = roster.map(s=>normalizeAnalysisMark(getAnalysisMarkValue(s.id,filters.year,assessment,filters.subject))).filter(x=>x.hasMark).map(x=>x.value);
            return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
        }

            make('ta-grade-chart',{type:'bar',data:{labels:Object.keys(dataset.gradeCounts),datasets:[{label:'Bilangan Murid',data:Object.values(dataset.gradeCounts)}]},options:{...common,scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});

            make('ta-assessment-chart',{type:'line',data:{labels:assessments.map(getAssessmentShortName),datasets:[{label:'Purata Markah',data:assessments.map(a=>Number(getAssessmentAverageForAnalysis(a,filters).toFixed(2))),tension:0.25,fill:false}]},options:{...common,scales:{y:{beginAtZero:true,max:100}}}});

        function exportTeacherAnalysisCSV() {
            const filters = { year:selectedYear, kelas:selectedClass, assessment:selectedAssessment, subject:selectedSubject };
            const data = buildTeacherAnalysisDataset(filters);
            const rows = getTeacherInterventionRows(data);
            const lines = [
                ['ANALISIS GURU SUBJEK'],['Sesi',filters.year],['Kelas',filters.kelas],['Pentaksiran',filters.assessment],['Subjek',filters.subject],[],
                ['Jumlah Murid',data.stats.total],['Jumlah Hadir',data.stats.attended],['Jumlah Tidak Hadir',data.stats.absent],['Bilangan Lulus',data.stats.passCount],['Bilangan Gagal',data.stats.failCount],['Peratus Lulus',data.stats.passPct.toFixed(1)+'%'],['Peratus Gagal',data.stats.failPct.toFixed(1)+'%'],['Markah Tertinggi',data.numeric.length?data.stats.highest:'-'],['Markah Terendah',data.numeric.length?data.stats.lowest:'-'],['Purata',data.numeric.length?data.stats.average.toFixed(2):'-'],['Median',data.numeric.length?data.stats.median.toFixed(2):'-'],[],
                ['Bil','Nama Murid','Markah','Gred','TP','Kategori','Kelemahan','Cadangan Intervensi','Status']
            ];
            const statusMap=getInterventionStatusMap();
            rows.forEach((r,i)=>{const k=`${filters.year}|${filters.kelas}|${filters.assessment}|${filters.subject}|${r.student.id}`;lines.push([i+1,r.student.nama,r.markObj.hasMark?r.markObj.value:(r.markObj.absent?'TH':'-'),r.grade,r.pbd||'-',r.categories.join(' / '),r.weakness,r.intervention,statusMap[k]||'Belum Bermula']);});
            const csv='\ufeff'+lines.map(row=>row.map(csvSafe).join(',')).join('\n');
            const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`Analisis_Guru_${filters.kelas}_${filters.subject}_${getAssessmentShortName(filters.assessment)}_${filters.year}.csv`.replace(/[^a-zA-Z0-9_.-]+/g,'_');document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast('Analisis berjaya dieksport ke CSV.','success');
        }

            const calculated = calculateUASAGrade(score);

        }


        function getSubjectStudentCountForYear(yearNum) {
            return students.filter(s => String(s.kelas || '').startsWith(String(yearNum) + ' ')).length;
        }

        function calculateGradeStatsForYear(yearNum, subject, assessmentName) {
            const activeStudents = students.filter(s => String(s.kelas || '').startsWith(String(yearNum) + ' '));
            const stats = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, total: activeStudents.length, filled: 0 };
            activeStudents.forEach(st => {
                const key = `${st.id}_${analysisSelectedAcademicYearPBD}_${assessmentName}_${subject}`;
                const raw = studentMarks[key];
                if (raw !== undefined && raw !== null && raw !== '') {
                    const grade = calculateUASAGrade(raw).grade;
                    if (stats[grade] !== undefined) {
                        stats[grade]++;
                        stats.filled++;
                    }
                }
            });
            return stats;
        }

        function renderGradeCells(stats) {
            const denominator = stats.total || 1;
            return ['A', 'B', 'C', 'D', 'E', 'F'].map(g => {
                const bil = stats[g] || 0;
                const pct = ((bil / denominator) * 100).toFixed(2);
                return `<td>${bil}</td><td>${pct}</td>`;
            }).join('');
        }

        function wrapSubjectName(subject) {
            return String(subject || '').split(' ').map(w => w.length > 10 ? w.slice(0, 10) + '<br>' + w.slice(10) : w).join('<br>');
        }

        function cloneGradeStats() {
            return { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, total: 0, filled: 0 };
        }

        function addGradeStats(target, source) {
            ['A', 'B', 'C', 'D', 'E', 'F'].forEach(g => target[g] += (source[g] || 0));

        }

                                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Export Excel
                            </button>
                            <button onclick="printReport()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg text-xs flex items-center gap-1.5 transition-all shadow-sm">
                                <i data-lucide="printer" class="w-4 h-4"></i> Print Laporan
                            </button>
                        </div>
                    </div>

                    <div id="print-area" class="bg-white p-8 rounded-2xl border border-slate-100 shadow-sm excel-report-container space-y-6">
                        <div class="text-center space-y-1 pb-4">
                            <h2 class="text-lg font-bold uppercase tracking-tight">ANALISIS PENTAKSIRAN BILIK DARJAH (PBD)</h2>
                            <h2 class="text-md font-bold uppercase tracking-tight">SESI AKADEMIK ${analysisSelectedAcademicYearPBD}</h2>
                            <h2 class="text-sm font-bold uppercase tracking-tight">MENGIKUT KELAS</h2>
                        </div>

                        <div class="excel-bg-yellow py-1 text-center text-sm uppercase rounded tracking-wide border border-black max-w-xs mx-auto">
                            TAHUN ${analysisSelectedYearPBD}
                        </div>

                        <div class="space-y-8 pt-4">
                            ${baseSubjects.map(sub => {
                                const subData = stats[sub];
                                const al = subData['AL-KHAWARIZMI'];
                                const alTot = al.Total || 1;
                                const ar = subData['AR-RAZI'];
                                const arTot = ar.Total || 1;
                                const j = subData['JUMLAH'];
                                const jTot = j.Total || 1;

                                return `
                                    <div class="space-y-1.5">
                                        <div class="excel-bg-purple-subject py-1.5 border border-black text-xs uppercase font-bold pl-3">
                                            MATA PELAJARAN: ${sub}
                                        </div>
                                        <table class="excel-table">
                                            <thead>
                                                <tr class="bg-slate-50 font-bold">
                                                    <th class="w-12">Bil</th>
                                                    <th class="text-left pl-3">Kelas</th>
                                                    <th>TP1</th><th>%</th>
                                                    <th>TP2</th><th>%</th>
                                                    <th>TP3</th><th>%</th>
                                                    <th>TP4</th><th>%</th>
                                                    <th>TP5</th><th>%</th>
                                                    <th>TP6</th><th>%</th>
                                                    <th class="w-20">Jumlah</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td>1</td>
                                                    <td class="text-left pl-3 font-semibold">AL-KHAWARIZMI</td>
                                                    <td>${al.TP1}</td><td>${((al.TP1/alTot)*100).toFixed(1)}%</td>
                                                    <td>${al.TP2}</td><td>${((al.TP2/alTot)*100).toFixed(1)}%</td>
                                                    <td>${al.TP3}</td><td>${((al.TP3/alTot)*100).toFixed(1)}%</td>
                                                    <td>${al.TP4}</td><td>${((al.TP4/alTot)*100).toFixed(1)}%</td>
                                                    <td>${al.TP5}</td><td>${((al.TP5/alTot)*100).toFixed(1)}%</td>
                                                    <td>${al.TP6}</td><td>${((al.TP6/alTot)*100).toFixed(1)}%</td>
                                                    <td class="font-bold">${al.Total}</td>
                                                </tr>
                                                <tr>
                                                    <td>2</td>
                                                    <td class="text-left pl-3 font-semibold">AR-RAZI</td>
                                                    <td>${ar.TP1}</td><td>${((ar.TP1/arTot)*100).toFixed(1)}%</td>
                                                    <td>${ar.TP2}</td><td>${((ar.TP2/arTot)*100).toFixed(1)}%</td>
                                                    <td>${ar.TP3}</td><td>${((ar.TP3/arTot)*100).toFixed(1)}%</td>
                                                    <td>${ar.TP4}</td><td>${((ar.TP4/arTot)*100).toFixed(1)}%</td>
                                                    <td>${ar.TP5}</td><td>${((ar.TP5/arTot)*100).toFixed(1)}%</td>
                                                    <td>${ar.TP6}</td><td>${((ar.TP6/arTot)*100).toFixed(1)}%</td>
                                                    <td class="font-bold">${ar.Total}</td>
                                                </tr>
                                                <tr class="excel-bg-blue-total font-bold">
                                                    <td></td>
                                                    <td class="text-left pl-3">JUMLAH</td>
                                                    <td>${j.TP1}</td><td>${((j.TP1/jTot)*100).toFixed(1)}%</td>
                                                    <td>${j.TP2}</td><td>${((j.TP2/jTot)*100).toFixed(1)}%</td>
                                                    <td>${j.TP3}</td><td>${((j.TP3/jTot)*100).toFixed(1)}%</td>
                                                    <td>${j.TP4}</td><td>${((j.TP4/jTot)*100).toFixed(1)}%</td>
                                                    <td>${j.TP5}</td><td>${((j.TP5/jTot)*100).toFixed(1)}%</td>
                                                    <td>${j.TP6}</td><td>${((j.TP6/jTot)*100).toFixed(1)}%</td>
                                                    <td>${j.Total}</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- PRESTASI INDIVIDU & RINGKASAN ORIGINAL ---
        function renderAnalysisIndividu() {
            const student = students.find(s => s.id == analysisSelectedStudentId) || students[0];
            if (!student) {
                return `<div class="p-6 bg-white border rounded-2xl text-center text-xs font-bold text-slate-400">Tiada data murid untuk dianalisis.</div>`;
            }

            const subjectsToUse = baseSubjects;

            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl border border-blue-100 shadow-sm space-y-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Pilih Murid</label>
                            <select onchange="analysisSelectedStudentId=this.value; renderPage()" class="w-full p-2.5 border border-gray-100 rounded-xl text-xs font-bold text-slate-700 outline-none focus:ring-1 focus:ring-blue-500">
                                ${students.map(s => `<option value="${s.id}" ${s.id==analysisSelectedStudentId?'selected':''}>${s.nama} (${s.kelas})</option>`).join('')}
                            </select>
                        </div>

                        <div class="p-4 bg-slate-100 rounded-2xl border border-blue-100/50 space-y-2">
                            <div class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center font-extrabold text-sm mb-2">${student.nama.charAt(0)}</div>
                            <h4 class="font-bold text-slate-800 text-xs">${student.nama}</h4>
                            <p class="text-[10px] text-slate-500 font-semibold">${student.ic}</p>
                            <p class="text-[10px] text-blue-700 font-extrabold bg-blue-50 inline-block px-2.5 py-0.5 rounded-full">${student.kelas}</p>
                        </div>
                    </div>

                    <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-blue-100 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-800 text-sm">Profil Akademik Pentaksiran UASA & PBD</h3>
                        <div class="overflow-y-auto max-h-[300px] border border-slate-100 rounded-2xl">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-100 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                                        <th class="p-3">Mata Pelajaran</th>
                                        <th class="p-3 text-center">Markah</th>
                                        <th class="p-3 text-center">Gred</th>
                                        <th class="p-3 text-center">PBD TP</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${subjectsToUse.map(sub => {
                                        const key = `${student.id}_${selectedYear}_${analysisSelectedAssessment}_${sub}`;
                                        const score = studentMarks[key];
                                        const pbdVal = studentPBD[key] || '-';
                                        const gradeRes = calculateUASAGrade(score);

                                        return `
                                            <tr>
                                                <td class="p-3 font-bold text-slate-700">${sub}</td>
                                                <td class="p-3 text-center font-bold text-slate-800">${score !== undefined ? score + '%' : '-'}</td>
                                                <td class="p-3 text-center">
                                                    <span class="inline-block px-2 py-0.5 rounded-full font-bold text-[9px] border ${gradeRes.color}">${gradeRes.grade}</span>
                                                </td>
                                                <td class="p-3 text-center"><span class="font-extrabold text-purple-600 bg-purple-50 px-2.5 py-0.5 rounded-full text-[9px]">${pbdVal}</span></td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- PERFORMANCE / RENDER FOR PBD RINGKASAN ---
        function renderAnalysisPBD() {
            return `
                <div class="bg-white p-6 rounded-2xl border border-blue-100 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-sm">Ringkasan Analisis Tahap Penguasaan (TP) PBD</h3>
                    <p class="text-xs text-slate-500 font-medium">Berdasarkan data pentaksiran yang disimpan, berikut adalah statistik purata pencapaian TP bagi kelas ${selectedClass}:</p>
                    <div class="grid grid-cols-2 md:grid-cols-6 gap-3 pt-3">
                        ${['TP1','TP2','TP3','TP4','TP5','TP6'].map((tp, idx) => {
                            const count = Object.values(studentPBD).filter(v => v === tp).length;
                            return `
                                <div class="p-4 border border-slate-100/80 bg-slate-50/30 rounded-2xl text-center space-y-1">
                                    <span class="text-xs font-bold text-blue-600">${tp}</span>
                                    <h4 class="text-xl font-black text-slate-800">${count}</h4>
                                    <p class="text-[9px] text-slate-400 font-bold uppercase">Subjek Murid</p>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // --- WINDOW BOOTSTRAP ---
        window.onload = async function() {
            await initSupabase();
            lucide.createIcons();
            renderPage();
        };
    </script> 
</body>
</html>
