    <style>

        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none; }
        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #sidebar.closed {
            transform: translateX(-100%);
        }
        .sticky-col {
            position: sticky;
            left: 0;
            background-color: white;
            z-index: 10;
        }
        tr:hover .sticky-col {
            background-color: #f8fafc !important;
        }

        /* --- FORMAT LAPORAN SEKOLAH (EXCEL STYLE - etert.jpg) --- */
        .excel-report-container {
            font-family: 'Calibri', 'Arial', sans-serif;
            color: #000000;
        }
        .excel-table {
            border: 2px solid #000000 !important;
            border-collapse: collapse;
            width: 100%;
        }
        .excel-table th, .excel-table td {
            border: 1px solid #000000 !important;
            padding: 4px 6px;
            font-size: 11px;
            text-align: center;
            font-weight: bold;
            color: #000000;
        }
        .excel-table th {
            font-weight: bold;
            background-color: #FFFF00 !important; /* Header Kuning */
        }
        
        /* Lajur Tahun & Bil Murid berlatar biru muda */
        .excel-bg-blue-year {
            background-color: #CCFFFF !important;
            color: #000000 !important;
        }
        
        /* Tajuk mata pelajaran menggunakan warna ungu muda */
        .excel-bg-purple-subject {
            background-color: #E2D5F3 !important;
            color: #000000 !important;
        }
        
        /* Baris JUMLAH menggunakan warna kuning */
        .excel-bg-yellow-total {
            background-color: #FFFF00 !important;
            color: #000000 !important;
            font-weight: bold;
        }

        /* Lajur TP Berwarna Lembut */
        .tp1-col { background-color: #FFEBEE !important; }
        .tp2-col { background-color: #FFF3E0 !important; }
        .tp3-col { background-color: #FFFDE7 !important; }
        .tp4-col { background-color: #E8F5E9 !important; }
        .tp5-col { background-color: #E0F2F1 !important; }
        .tp6-col { background-color: #F3E5F5 !important; }



        /* --- TEMA PELBAGAI WARNA SISMAR --- */
        .theme-card-blue { background: linear-gradient(135deg,#2563eb,#4f46e5); }
        .theme-card-purple { background: linear-gradient(135deg,#7c3aed,#db2777); }
        .theme-card-orange { background: linear-gradient(135deg,#f97316,#f59e0b); }
        .theme-card-cyan { background: linear-gradient(135deg,#06b6d4,#2563eb); }
        .theme-soft-blue { background:#eff6ff; color:#1d4ed8; }
        .theme-soft-purple { background:#faf5ff; color:#7e22ce; }
        .theme-soft-orange { background:#fff7ed; color:#c2410c; }
        .theme-soft-cyan { background:#ecfeff; color:#0e7490; }

        /* --- PRINT MEDIA LAYOUT (A4 LANDSCAPE) --- */
        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
            }
            .no-print {
                display: none !important;
            }
            #print-area, #print-area * {
                visibility: visible !important;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            @page {
                size: A4 landscape;
                margin: 0.5cm;
            }
            tr, th, td, div {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        .slip-admin-panel { font-family: Arial, Helvetica, sans-serif; }

            font-size: 13px;

        .slip-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10mm;
            font-size: 11px;
            margin: 8px 0;
        }
        .slip-info-row {

            grid-template-columns: 30mm 4mm 1fr;
            margin-bottom: 4px;

            color: #000;
        }
        .slip-result-table th {
            text-align: center;
            font-weight: 800;
            background: #fff;
        }

        .slip-summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14mm;
            font-size: 11px;
            margin-top: 8px;
        }
        .slip-ulasan {
            border: 1px solid #000;
            min-height: 25mm;
            padding: 7px;
            font-size: 11px;
            margin-top: 8px;
        }
        .slip-signature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25mm;
            margin-top: 18mm;
            font-size: 11px;
            text-align: center;
        }
        .slip-signature-line { border-top: 1px solid #000; padding-top: 5px; font-weight: 700; }

        function normalizeTeacherName(value) {
            return String(value || '')
                .toUpperCase()
                .replace(/\b(PN|PUAN|EN|ENCIK|CIK|HJH|HJ|BT|BIN|BINTI)\.?\b/g, '')
                .replace(/[^A-Z0-9]/g, '')
                .trim();

        function normalizeClassName(value) {
            return String(value || '')
                .toUpperCase()
                .replace(/AL\s*-?\s*KHAWARIZMI/g, 'AL KHAWARIZMI')

                .trim();
        }

        function getClassYearOnly(value) {
            const match = normalizeClassName(value).match(/^(\d+)/);
            return match ? match[1] : '';
        }

        function getClassStreamOnly(value) {
            const normalized = normalizeClassName(value);

            if (/(^|\s)AL\s+KHAWARIZMI($|\s)/.test(normalized)) {
                return 'AL KHAWARIZMI';
            }

            if (/(^|\s)AR\s+RAZI($|\s)/.test(normalized)) {
                return 'AR RAZI';
            }

            return '';
        }

        function containsMultipleClasses(value) {
            const normalized = normalizeClassName(value);
            const hasAlKhawarizmi = /(^|\s)AL\s+KHAWARIZMI($|\s)/.test(normalized);
            const hasArRazi = /(^|\s)AR\s+RAZI($|\s)/.test(normalized);
            return hasAlKhawarizmi && hasArRazi;
        }

        function isSameClassOnly(value, targetClass) {
            if (!value || !targetClass) return false;
            if (containsMultipleClasses(value)) return false;

            const valueClass = normalizeClassName(value);
            const targetClassName = normalizeClassName(targetClass);

            // Padanan kelas dibuat secara tepat supaya 4 AL-KHAWARIZMI tidak bercampur dengan 4 AR-RAZI.
            // Tanda sempang dan jarak masih dibenarkan kerana normalizeClassName sudah menyeragamkannya.
            return valueClass === targetClassName;
        }

        function canonicalClassName(value) {
            const normalized = normalizeClassName(value);
            const match = classes.find(c => normalizeClassName(c) === normalized);
            return match || String(value || '').toUpperCase().trim();
        }

        // Penapis roster kelas yang ketat.

        function getStudentsByExactClass(kelasName) {
            const targetClass = canonicalClassName(kelasName);

            const seen = new Set();

        async function initSupabase() {
            try {
                if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('PASTE_')) {
                    console.warn('Supabase URL / Anon Key belum lengkap. Sistem berjalan dalam mod tempatan.');
                    supabaseEnabled = false;
                    return;
                }

                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                });

                supabaseEnabled = true;

                // Jangan ambil data sebelum login kerana RLS hanya benarkan pengguna authenticated.
                const { data: sessionData } = await supabaseClient.auth.getSession();
                if (sessionData && sessionData.session) {
                    await fetchAllDataFromSupabase();
                }

                console.log('Supabase initialized successfully');
            } catch (e) {
                supabaseEnabled = false;
                console.error('Supabase connection error:', e);
            }
        }

        async function fetchAllDataFromSupabase() {
            if (!supabaseEnabled || !supabaseClient) return;
            try {
                const { data: studentRows, error: studentError } = await supabaseClient
                    .from('students')
                    .select('id,nama,ic,kelas')
                    .order('kelas', { ascending: true })
                    .order('nama', { ascending: true });

                if (studentError) throw studentError;
                if (studentRows && studentRows.length > 0) {
                    students.length = 0;
                    studentRows.forEach(row => {
                        students.push({
                            id: row.id,
                            nama: row.nama,
                            ic: row.ic,
                            kelas: row.kelas
                        });
                    });
                }

                const { data: markRows, error: markError } = await supabaseClient
                    .from('marks')
                    .select('key,value,student_id,tahun,assessment,subject,teacher_email,teacher_name,kelas,updated_at');
                if (markError) throw markError;
                if (markRows) {
                    const cachedMarks = readCachedAssessmentRows(SISMAR_MARK_CACHE_KEY, 'MARKAH');
                    markStatusRows = mergeAssessmentRows(markRows, cachedMarks, 'MARKAH');
                    cacheAssessmentRows(SISMAR_MARK_CACHE_KEY, markStatusRows);

                const { data: pbdRows, error: pbdError } = await supabaseClient
                    .from('pbd')
                    .select('key,value,student_id,tahun,assessment,subject,teacher_email,teacher_name,kelas,updated_at');
                if (pbdError) throw pbdError;
                if (pbdRows) {
                    const cachedPbd = readCachedAssessmentRows(SISMAR_PBD_CACHE_KEY, 'PBD');
                    pbdStatusRows = mergeAssessmentRows(pbdRows, cachedPbd, 'PBD');
                    cacheAssessmentRows(SISMAR_PBD_CACHE_KEY, pbdStatusRows);
                }

                rebuildAssessmentMaps();

                // Direktori guru untuk pembetulan Admin. Emel digunakan secara dalaman sahaja dan tidak dipaparkan.
                try {
                    const { data: teacherDirectoryData, error: teacherDirectoryError } = await supabaseClient

                        .order('name', { ascending: true });

            try {

                        ic: student.ic,
                        kelas: student.kelas,
                        tahun: getStudentYear(student.kelas),
                        updated_at: new Date().toISOString()

                if (error) throw error;
            } catch (e) {
                console.error('Failed to persist student:', e);

        // --- PENGIRAAN STATISTIK PBD AUTOMATIK ---
        function calculatePBDStatsForYear(yearNum) {
            const result = {};
            const activeStudents = students.filter(s => s.kelas.startsWith(yearNum + ' '));

            baseSubjects.forEach(sub => {
                result[sub] = {
                    'AL-KHAWARIZMI': { TP1: 0, TP2: 0, TP3: 0, TP4: 0, TP5: 0, TP6: 0, Total: 0 },
                    'AR-RAZI': { TP1: 0, TP2: 0, TP3: 0, TP4: 0, TP5: 0, TP6: 0, Total: 0 },
                    'JUMLAH': { TP1: 0, TP2: 0, TP3: 0, TP4: 0, TP5: 0, TP6: 0, Total: 0 }
                };

                activeStudents.forEach(s => {
                    const classKey = getClassStreamOnly(s.kelas).replace('AL KHAWARIZMI', 'AL-KHAWARIZMI').replace('AR RAZI', 'AR-RAZI');
                    const key = `${s.id}_${analysisSelectedAcademicYearPBD}_${analysisSelectedAssessment}_${sub}`;
                    const tp = studentPBD[key];

                    if (tp && ['TP1', 'TP2', 'TP3', 'TP4', 'TP5', 'TP6'].includes(tp)) {
                        result[sub][classKey][tp]++;
                        result[sub][classKey].Total++;
                        result[sub]['JUMLAH'][tp]++;
                        result[sub]['JUMLAH'].Total++;
                    }
                });
            });

            return result;
        }

        // --- FUNGSI JANA RUMUSAN AUTOMATIK ---
        function generateAutomaticSummary(stats) {
            let bestSubject = '-';
            let bestScore = -1;
            let weakestSubject = '-';
            let weakestScore = 9999;

            baseSubjects.forEach(sub => {
                const data = stats[sub]['JUMLAH'];
                if (data.Total > 0) {
                    const menguasai = data.TP3 + data.TP4 + data.TP5 + data.TP6;
                    const pct = (menguasai / data.Total) * 100;
                    if (pct > bestScore) {
                        bestScore = pct;
                        bestSubject = sub;
                    }
                    if (pct < weakestScore) {
                        weakestScore = pct;
                        weakestSubject = sub;
                    }
                }
            });

            if (bestScore === -1) bestSubject = "Tiada Data";
            if (weakestScore === 9999) weakestSubject = "Tiada Data";

            return {
                bestSubject,
                weakestSubject,
                bestClass: "1 AR-RAZI",
                interventionClass: "1 AL-KHAWARIZMI",
                suggestions: [
                    "Menjalankan bimbingan berfokus (PLC) bagi subjek " + (weakestSubject !== "Tiada Data" ? weakestSubject : "yang dikenal pasti lemah") + ".",
                    "Memantapkan pelaksanaan aktiviti interaktif dan intervensi dalam bilik darjah.",
                    "Sesi perkongsian amalan terbaik di antara guru pentaksir subjek utama."
                ]
            };
        }

                        ]);
                        wsData.push([]);

        function csvSafe(value) {

        function getCurrentTeacherMarkRowsFromScreen() {
            return Array.from(document.querySelectorAll('.student-row')).map((row, index) => {

                const nameCell = row.querySelector('td:nth-child(2)');
                const icCell = row.querySelector('td:nth-child(3)');
                const mark = markInput ? markInput.value.trim() : '';

                return {
                    bil: index + 1,
                    nama: nameCell ? nameCell.textContent.trim() : '',
                    ic: icCell ? icCell.textContent.trim() : '',
                    markah: mark,
                    gred: gradeResult.grade,

                    pbd: pbdSelect ? pbdSelect.value : ''
                };

                    return;
                }

                const headerInfo = [

                    ['Mata Pelajaran', selectedSubject],
                    ['Guru Pentaksir', selectedTeacher],

                const csvLines = [];

                headerInfo.forEach(line => csvLines.push(line.map(csvSafe).join(',')));

                rows.forEach(r => {
                    csvLines.push([r.bil, r.nama, r.ic, r.markah, r.gred, r.tahap, r.pbd].map(csvSafe).join(','));
                });

                const blob = new Blob(['\ufeff' + csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });

        // --- GRADES MATH ---
        function calculateUASAGrade(score) {
            if (score === null || score === undefined || score === '') {
                return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
            }
            const num = parseFloat(score);
            if (num >= 82 && num <= 100) return { grade: 'A', color: 'text-blue-700 bg-blue-50 border-blue-200', label: 'CEMERLANG' };
            if (num >= 66 && num <= 81) return { grade: 'B', color: 'text-cyan-700 bg-cyan-50 border-cyan-200', label: 'KEPUJIAN' };
            if (num >= 50 && num <= 65) return { grade: 'C', color: 'text-amber-700 bg-amber-50 border-amber-200', label: 'MEMUASKAN' };
            if (num >= 35 && num <= 49) return { grade: 'D', color: 'text-orange-700 bg-orange-50 border-orange-200', label: 'MENCAPAI TAHAP MINIMUM' };
            if (num >= 1 && num <= 34) return { grade: 'E', color: 'text-rose-700 bg-rose-50 border-rose-200', label: 'BELUM MENCAPAI TAHAP MINIMUM' };
            if (num === 0) return { grade: 'F', color: 'text-red-700 bg-red-100 border-red-300', label: 'TIDAK MENGUASAI' };
            return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
        }

        // --- SUBMIT AND PERSIST ASSESSMENT ---
        async function saveMarks(silent = false) {
            const rows = document.querySelectorAll('.student-row');
            let successCount = 0;
            const markRows = [];
            const pbdRows = [];

            for (const row of rows) {
                const sId = row.getAttribute('data-id');
                const markInput = row.querySelector('.mark-input');
                const pbdSelect = row.querySelector('.pbd-select');
                const key = `${sId}_${selectedYear}_${selectedAssessment}_${selectedSubject}`;
                const keyInfo = parseKey(key);

                if (markInput) {
                    const markVal = markInput.value.trim();

                    if (markVal === '') {
                        delete studentMarks[key];
                    } else {
                        const num = parseFloat(markVal);
                        if (!isNaN(num) && num >= 0 && num <= 100) {
                            studentMarks[key] = num;
                            markRows.push({
                                key,
                                student_id: String(keyInfo.student_id),
                                tahun: keyInfo.tahun,
                                assessment: keyInfo.assessment,
                                subject: keyInfo.subject,
                                value: num,
                                teacher_email: currentUser ? currentUser.email : null,
                                teacher_name: selectedTeacher,
                                kelas: canonicalClassName(selectedClass),
                                updated_at: new Date().toISOString()
                            });
                            successCount++;
                        }
                    }

                    if (pbdSelect) {
                        const pbdVal = pbdSelect.value;
                        if (pbdVal) {
                            studentPBD[key] = pbdVal;
                            pbdRows.push({
                                key,
                                student_id: String(keyInfo.student_id),
                                tahun: keyInfo.tahun,
                                assessment: keyInfo.assessment,
                                subject: keyInfo.subject,
                                value: pbdVal,
                                teacher_email: currentUser ? currentUser.email : null,
                                teacher_name: selectedTeacher,
                                kelas: canonicalClassName(selectedClass),
                                updated_at: new Date().toISOString()
                            });
                        } else {
                            delete studentPBD[key];
                        }
                    }
                }
            }

            // Kemas kini status tempatan dahulu supaya Dashboard Guru Kelas terus nampak markah
            // walaupun Supabase lambat refresh atau RLS tidak memulangkan row kepada akaun semasa.
            markStatusRows = mergeAssessmentRows(markStatusRows, markRows, 'MARKAH');
            pbdStatusRows = mergeAssessmentRows(pbdStatusRows, pbdRows, 'PBD');
            cacheAssessmentRows(SISMAR_MARK_CACHE_KEY, markStatusRows);
            cacheAssessmentRows(SISMAR_PBD_CACHE_KEY, pbdStatusRows);
            rebuildAssessmentMaps();

            const saved = await persistMarksBulkToSupabase(markRows, pbdRows);
            if (saved) {
                await fetchAllDataFromSupabase();
            }

            if (!silent) {
                showToast(`Selesai menyimpan ${successCount} rekod prestasi. Markah dipulihkan dalam paparan Dashboard Guru Kelas.`, 'success');
            }
            renderPage();
        }

        // --- CSV LOADING AND PROCESSING ---
        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = text.split('\n');
                tempUploadedStudents = [];

                for (let i = 1; i < rows.length; i++) {
                    const columns = rows[i].split(',');
                    if (columns.length >= 3) {
                        const nama = columns[0].trim().toUpperCase();
                        const ic = columns[1].trim();
                        const kelas = canonicalClassName(columns[2].trim());

                        if (nama && ic && kelas) {
                            tempUploadedStudents.push({ nama, ic, kelas });
                        }
                    }
                }

                const infoBox = document.getElementById('csv-preview-info');
                if (infoBox) {
                    infoBox.innerText = `Menjumpai ${tempUploadedStudents.length} murid sedia untuk diimport.`;
                    infoBox.classList.remove('hidden');
                }
                showToast(`Selesai memuat fail. Sila klik SIMPAN untuk memasukkannya ke sistem.`, 'info');
            };
            reader.readAsText(file);
        }

        async function saveCSVData() {
            if (tempUploadedStudents.length === 0) {
                showToast('Tiada data fail CSV dikesan. Sila pilih fail terlebih dahulu.', 'warning');
                return;
            }

            let importCount = 0;
            const startId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;

            for (let i = 0; i < tempUploadedStudents.length; i++) {
                const row = tempUploadedStudents[i];
                const exists = students.some(s => s.ic === row.ic);
                
                if (!exists) {
                    const studentObj = {
                        id: startId + importCount,
                        nama: row.nama,
                        ic: row.ic,
                        kelas: row.kelas
                    };
                    students.push(studentObj);
                    importCount++;
                }
            }

            const newStudentsForUpload = students.slice(students.length - importCount);
            await persistStudentsBulkToSupabase(newStudentsForUpload);

            tempUploadedStudents = [];
            const infoBox = document.getElementById('csv-preview-info');
            if (infoBox) {
                infoBox.classList.add('hidden');
            }
            const csvInput = document.getElementById('csv-file-input');
            if (csvInput) csvInput.value = '';

            showToast(`Berjaya mendaftar ${importCount} murid baharu ke sistem & Supabase!`, 'success');
            renderPage();
        }

        function buildFillingStatusRows(scope = 'admin', classFilter = null) {
            const grouped = {};
            const allRows = [
                ...(markStatusRows || []).map(row => ({ ...row, data_type: 'MARKAH' })),
                ...(pbdStatusRows || []).map(row => ({ ...row, data_type: 'PBD' }))
            ];

            const filteredRows = allRows.filter(row => {
                if (!row) return false;
                if (selectedYear && String(row.tahun) !== String(selectedYear)) return false;
                if (selectedAssessment && row.assessment !== selectedAssessment) return false;
                if (classFilter && !isSameClassOnly(row.kelas, classFilter)) return false;
                if (containsMultipleClasses(row.kelas)) return false;
                return true;
            });

            filteredRows.forEach(row => {
                const kelasName = canonicalClassName(row.kelas || '-');
                const subjectName = row.subject || '-';
                const teacherName = row.teacher_name || row.teacher_email || '-';
                const teacherEmail = cleanEmail(row.teacher_email || '');
                const assessmentName = row.assessment || '-';
                const tahunName = row.tahun || selectedYear;
                const key = [tahunName, assessmentName, normalizeClassName(kelasName), subjectName, teacherEmail || normalizeTeacherName(teacherName)].join('||');

                if (!grouped[key]) {
                    grouped[key] = {
                        tahun: tahunName,
                        assessment: assessmentName,
                        kelas: kelasName,
                        subject: subjectName,
                        teacher_name: teacherName,
                        teacher_email: row.teacher_email || '-',
                        markStudentIds: new Set(),
                        pbdStudentIds: new Set(),
                        allStudentIds: new Set(),
                        updated_at: row.updated_at || row.tarikh || null
                    };
                }

                if (row.student_id) {
                    grouped[key].allStudentIds.add(String(row.student_id));
                    if (row.data_type === 'MARKAH') grouped[key].markStudentIds.add(String(row.student_id));
                    if (row.data_type === 'PBD') grouped[key].pbdStudentIds.add(String(row.student_id));
                }

                const rowDate = row.updated_at || row.tarikh || null;
                if (rowDate && (!grouped[key].updated_at || new Date(rowDate) > new Date(grouped[key].updated_at))) {
                    grouped[key].updated_at = rowDate;
                }
            });

            const result = Object.values(grouped).map(item => {
                const total = getClassStudentCount(item.kelas);
                const markCompleted = item.markStudentIds.size;
                const pbdCompleted = item.pbdStudentIds.size;
                const completed = Math.min(markCompleted, pbdCompleted);
                const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
                let status = 'BELUM MULA';
                if ((markCompleted > 0 || pbdCompleted > 0) && completed < total) status = 'SEBAHAGIAN';
                if (total > 0 && markCompleted >= total && pbdCompleted >= total) status = 'SIAP';
                return { ...item, total, completed, markCompleted, pbdCompleted, percent, status };
            });

            return result.sort((a, b) => {
                return (a.kelas + a.subject + a.teacher_name).localeCompare(b.kelas + b.subject + b.teacher_name);
            });
        }

        async function updateRowsForTable(tableName, oldPayload, newPayload) {
            const oldEmail = cleanEmail(oldPayload.teacher_email);
            let query = supabaseClient
                .from(tableName)
                .select('student_id,tahun,assessment,subject,kelas,teacher_email,teacher_name')
                .eq('tahun', String(oldPayload.tahun))
                .eq('assessment', oldPayload.assessment)
                .eq('subject', oldPayload.subject)
                .eq('kelas', oldPayload.kelas);

            if (oldEmail && oldEmail !== '-') {
                query = query.eq('teacher_email', oldEmail);
            } else {
                query = query.eq('teacher_name', oldPayload.teacher_name);
            }

            const { data: rows, error: selectError } = await query;
            if (selectError) throw selectError;
            if (!rows || rows.length === 0) return 0;

            let updatedCount = 0;
            for (const row of rows) {
                const newKey = `${row.student_id}_${newPayload.tahun}_${newPayload.assessment}_${newPayload.subject}`;
                let updateQuery = supabaseClient
                    .from(tableName)
                    .update({
                        key: newKey,
                        tahun: String(newPayload.tahun),
                        assessment: newPayload.assessment,
                        subject: newPayload.subject,
                        kelas: newPayload.kelas,
                        teacher_name: newPayload.teacher_name,
                        teacher_email: newPayload.teacher_email || oldPayload.teacher_email || null,
                        updated_at: new Date().toISOString()
                    })
                    .eq('student_id', String(row.student_id))
                    .eq('tahun', String(oldPayload.tahun))
                    .eq('assessment', oldPayload.assessment)
                    .eq('subject', oldPayload.subject)
                    .eq('kelas', oldPayload.kelas);

                const rowEmail = cleanEmail(row.teacher_email || oldPayload.teacher_email);
                if (rowEmail && rowEmail !== '-') {
                    updateQuery = updateQuery.eq('teacher_email', rowEmail);
                } else {
                    updateQuery = updateQuery.eq('teacher_name', oldPayload.teacher_name);
                }

                const { error: updateError } = await updateQuery;
                if (updateError) throw updateError;
                updatedCount++;
            }
            return updatedCount;
        }

        function getAssessmentMarkValue(studentId, tahun, assessment, subject) {
            const key = makeAssessmentKey(studentId, tahun, assessment, subject);
            if (studentMarks[key] !== undefined && studentMarks[key] !== null && studentMarks[key] !== '') {
                return studentMarks[key];
            }

            const row = (markStatusRows || []).find(r =>
                String(r.student_id) === String(studentId) &&
                String(r.tahun) === String(tahun) &&
                String(r.assessment) === String(assessment) &&
                String(r.subject) === String(subject) &&
                r.value !== null && r.value !== undefined && r.value !== ''
            );

            return row ? row.value : '';
        }

        function getAssessmentPBDValue(studentId, tahun, assessment, subject) {
            const key = makeAssessmentKey(studentId, tahun, assessment, subject);
            if (studentPBD[key] !== undefined && studentPBD[key] !== null && studentPBD[key] !== '') {
                return studentPBD[key];
            }

            const row = (pbdStatusRows || []).find(r =>
                String(r.student_id) === String(studentId) &&
                String(r.tahun) === String(tahun) &&
                String(r.assessment) === String(assessment) &&
                String(r.subject) === String(subject) &&
                r.value !== null && r.value !== undefined && r.value !== ''
            );

            return row ? row.value : '';
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderDetailedMarksPanel(scope = 'admin', classFilter = null) {
            const activeClass = canonicalClassName(classFilter || selectedClass || classes[0]);
            const activeSubject = selectedSubject || baseSubjects[0];
            const activeYear = selectedYear || years[0];
            const activeAssessment = selectedAssessment || assessments[0];
            const classStudents = getStudentsByExactClass(activeClass);
            const rows = classStudents.map((student, index) => {
                const mark = getAssessmentMarkValue(student.id, activeYear, activeAssessment, activeSubject);

                const gradeInfo = mark !== '' ? calculateUASAGrade(mark) : null;

            return students.find(s => String(s.id) === String(slipSelectedStudentId)) || students[0] || null;
        }

        function getSlipGender(ic) {
            const digits = String(ic || '').replace(/\D/g, '');
            if (!digits) return '-';
            const last = parseInt(digits.charAt(digits.length - 1), 10);
            if (Number.isNaN(last)) return '-';
            return last % 2 === 0 ? 'PEREMPUAN' : 'LELAKI';
        }

        function getSlipMark(studentId, subject) {
            const key = `${studentId}_${slipSelectedYear}_${slipSelectedAssessment}_${subject}`;
            if (studentMarks[key] !== undefined && studentMarks[key] !== null && studentMarks[key] !== '') return studentMarks[key];
            const row = (markStatusRows || []).find(r =>
                String(r.student_id) === String(studentId) &&
                String(r.tahun) === String(slipSelectedYear) &&
                r.assessment === slipSelectedAssessment &&
                r.subject === subject
            );
            return row ? row.value : '';
        }

        function getSlipGrade(mark) {
            if (mark === '' || mark === null || mark === undefined) return 'E';
            const num = parseFloat(mark);
            if (Number.isNaN(num)) return 'E';
            return calculateUASAGrade(num).grade;
        }

            if (slipSelectedAssessment === 'UJIAN AKHIR SESI AKADEMIK (UASA)') {

            return `${slipSelectedAssessment} ${slipSelectedYear}`;
        }

        function getStudentTotalForSlip(student) {
            if (!student) return { total: 0, percent: 0, numericCount: 0 };
            const subjectsForSlip = getSlipSubjectsForStudent(student);
            let total = 0;
            let numericCount = 0;
            subjectsForSlip.forEach(subject => {
                const mark = getSlipMark(student.id, subject);
                const num = parseFloat(mark);
                if (!Number.isNaN(num)) {
                    total += num;
                    numericCount++;
                }
            });
            const percent = subjectsForSlip.length > 0 ? (total / (subjectsForSlip.length * 100)) * 100 : 0;
            return { total, percent, numericCount };
        }

        function getSlipClassRank(student) {
            if (!student) return '-';
            const classmates = getStudentsByExactClass(student.kelas);
            const scores = classmates.map(s => ({ id: s.id, total: getStudentTotalForSlip(s).total }))
                .sort((a, b) => b.total - a.total);
            const index = scores.findIndex(s => String(s.id) === String(student.id));
            return index >= 0 ? index + 1 : '-';
        }

            const grouped = {};

            function shouldInclude(row) {
                if (!row) return false;
                const rowEmail = String(row.teacher_email || '').trim().toLowerCase();
                const rowTeacher = normalizeName(row.teacher_name);
                if (guruEmail && rowEmail === guruEmail) return true;
                if (guruName && rowTeacher === guruName) return true;
                return false;
            }

            function ensureGroup(row) {
                const tahunName = row.tahun || selectedYear;
                const assessmentName = row.assessment || selectedAssessment;
                const kelasName = row.kelas || '-';
                const subjectName = row.subject || '-';
                const teacherName = row.teacher_name || currentUser?.name || '-';
                const key = [tahunName, assessmentName, kelasName, subjectName].join('||');

                if (!grouped[key]) {
                    grouped[key] = {
                        tahun: tahunName,
                        assessment: assessmentName,
                        kelas: kelasName,
                        subject: subjectName,
                        teacher_name: teacherName,
                        teacher_email: row.teacher_email || currentUser?.email || '-',
                        markIds: new Set(),
                        pbdIds: new Set(),
                        updated_at: row.updated_at || null
                    };
                }

                if (row.updated_at && (!grouped[key].updated_at || new Date(row.updated_at) > new Date(grouped[key].updated_at))) {
                    grouped[key].updated_at = row.updated_at;
                }

                return grouped[key];
            }

            (markStatusRows || []).filter(shouldInclude).forEach(row => {
                const g = ensureGroup(row);
                if (row.student_id && row.value !== null && row.value !== undefined && row.value !== '') {
                    g.markIds.add(String(row.student_id));
                }
            });

            (pbdStatusRows || []).filter(shouldInclude).forEach(row => {
                const g = ensureGroup(row);
                if (row.student_id && row.value !== null && row.value !== undefined && row.value !== '') {
                    g.pbdIds.add(String(row.student_id));
                }
            });

            return Object.values(grouped).map(item => {
                const total = getClassStudentCount(item.kelas);
                const markCompleted = item.markIds.size;
                const pbdCompleted = item.pbdIds.size;
                const completeBoth = Math.min(markCompleted, pbdCompleted);
                const percent = total > 0 ? Math.round((completeBoth / total) * 100) : 0;
                let status = 'BELUM MULA';
                if (completeBoth > 0 && completeBoth < total) status = 'SEBAHAGIAN';
                if (total > 0 && markCompleted >= total && pbdCompleted >= total) status = 'SIAP';
                return { ...item, total, markCompleted, pbdCompleted, completeBoth, percent, status };
            }).sort((a, b) => {
                return (a.kelas + a.subject + a.assessment).localeCompare(b.kelas + b.subject + b.assessment);
            });
        }

        // --- PEMULIHAN MARKAH SISMAR ---
        // Cache ini tidak mengubah struktur asal. Ia hanya melindungi markah yang sudah diisi
        // daripada hilang pada paparan Dashboard Guru Kelas jika bacaan Supabase lambat, RLS terhad,
        // atau column key lama kosong.
        const SISMAR_MARK_CACHE_KEY = 'sismar_mark_rows_cache_v1';
        const SISMAR_PBD_CACHE_KEY = 'sismar_pbd_rows_cache_v1';

        function makeAssessmentKey(studentId, tahun, assessment, subject) {
            return `${studentId}_${tahun}_${assessment}_${subject}`;
        }

        function normalizeSavedRow(row, type = 'MARKAH') {
            if (!row) return null;
            const parsed = row.key ? parseKey(row.key) : {};
            const studentId = String(row.student_id || parsed.student_id || '').trim();
            const tahun = String(row.tahun || parsed.tahun || selectedYear || '').trim();
            const assessment = row.assessment || parsed.assessment || selectedAssessment || '';
            const subject = row.subject || parsed.subject || selectedSubject || '';
            if (!studentId || !tahun || !assessment || !subject) return null;
            return {
                ...row,
                key: row.key || makeAssessmentKey(studentId, tahun, assessment, subject),
                student_id: studentId,
                tahun,
                assessment,
                subject,
                value: row.value,
                teacher_email: row.teacher_email || (currentUser ? currentUser.email : null),
                teacher_name: row.teacher_name || selectedTeacher || '-',
                kelas: canonicalClassName(row.kelas || selectedClass || ''),
                updated_at: row.updated_at || new Date().toISOString(),
                data_type: type
            };
        }

        function cacheAssessmentRows(storageKey, rows) {
            try {
                const existing = JSON.parse(localStorage.getItem(storageKey) || '[]');
                const merged = {};
                existing.concat(rows || []).forEach(item => {
                    const row = normalizeSavedRow(item, storageKey === SISMAR_MARK_CACHE_KEY ? 'MARKAH' : 'PBD');
                    if (!row) return;
                    const k = [row.student_id, row.tahun, row.assessment, row.subject].join('||');
                    merged[k] = row;
                });
                localStorage.setItem(storageKey, JSON.stringify(Object.values(merged)));
            } catch (e) {
                console.warn('Cache markah tidak dapat dikemas kini:', e);
            }
        }

        function readCachedAssessmentRows(storageKey, type = 'MARKAH') {
            try {
                return (JSON.parse(localStorage.getItem(storageKey) || '[]') || [])
                    .map(row => normalizeSavedRow(row, type))
                    .filter(Boolean);
            } catch (e) {
                return [];
            }
        }

        function mergeAssessmentRows(primaryRows, cachedRows, type = 'MARKAH') {
            const merged = {};
            (cachedRows || []).concat(primaryRows || []).forEach(item => {
                const row = normalizeSavedRow(item, type);
                if (!row) return;
                const k = [row.student_id, row.tahun, row.assessment, row.subject].join('||');
                merged[k] = row;
            });
            return Object.values(merged);
        }

        function rebuildAssessmentMaps() {
            Object.keys(studentMarks).forEach(k => delete studentMarks[k]);
            (markStatusRows || []).forEach(row => {
                const fixed = normalizeSavedRow(row, 'MARKAH');
                if (fixed && fixed.key && fixed.value !== null && fixed.value !== undefined && fixed.value !== '') {
                    studentMarks[fixed.key] = fixed.value;
                }
            });

            Object.keys(studentPBD).forEach(k => delete studentPBD[k]);
            (pbdStatusRows || []).forEach(row => {
                const fixed = normalizeSavedRow(row, 'PBD');
                if (fixed && fixed.key && fixed.value !== null && fixed.value !== undefined && fixed.value !== '') {
                    studentPBD[fixed.key] = fixed.value;
                }
            });
        }

        function getVerificationForClass(kelasName, jenis) {
            return (classVerificationRows || []).find(row =>
                isSameClassOnly(row.kelas, kelasName) &&

            );

        function getClassCompletionSummary(kelasName) {
            const classStudents = getStudentsByExactClass(kelasName);
            const totalStudents = classStudents.length;
            const subjectList = getSubjectsForClass(kelasName);
            let completedSubjects = 0;
            let partialSubjects = 0;
            let totalFilled = 0;

            subjectList.forEach(sub => {
                const combinedRows = [ ...(markStatusRows || []), ...(pbdStatusRows || []) ];
                const filled = new Set(combinedRows.filter(row =>
                    isSameClassOnly(row.kelas, kelasName) &&
                    row.subject === sub &&
                    row.assessment === selectedAssessment &&
                    String(row.tahun) === String(selectedYear)
                ).map(row => String(row.student_id))).size;

                totalFilled += filled;
                if (totalStudents > 0 && filled >= totalStudents) completedSubjects++;
                else if (filled > 0) partialSubjects++;
            });

            const totalRequired = totalStudents * subjectList.length;
            const percent = totalRequired > 0 ? Math.round((totalFilled / totalRequired) * 100) : 0;
            return { totalStudents, subjectCount: subjectList.length, completedSubjects, partialSubjects, totalFilled, totalRequired, percent };
        }

        function getSubjectsForClass(kelasName) {
            const yearLevel = parseInt(String(kelasName || '').charAt(0), 10) || 1;
            const tahap1 = ['BAHASA MELAYU', 'BAHASA INGGERIS', 'MATEMATIK', 'SAINS', 'PENDIDIKAN ISLAM', 'BAHASA ARAB', 'PENDIDIKAN SENI VISUAL', 'PENDIDIKAN JASMANI DAN KESIHATAN', 'MUZIK'];
            const tahap2 = [...tahap1, 'SEJARAH', 'REKA BENTUK TEKNOLOGI'];
            return yearLevel <= 3 ? tahap1 : tahap2;
        }

        async function submitClassVerification(jenis) {
            if (!supabaseEnabled || !supabaseClient) {
                showToast('Supabase belum disambungkan.', 'danger');
                return;
            }
            if (!guruKelasSelectedClass) {
                showToast('Sila pilih kelas terlebih dahulu.', 'warning');
                return;
            }

            const payload = {
                kelas: guruKelasSelectedClass,
                tahun: String(selectedYear),
                assessment: selectedAssessment,
                jenis,
                guru_kelas: currentUser?.name || 'Guru Kelas',
                guru_email: currentUser?.email || null,
                status: 'Menunggu Semakan Admin',
                tarikh: new Date().toISOString()
            };

            try {
                const { data: existingRows, error: findError } = await supabaseClient
                    .from('semakan_guru_kelas')
                    .select('id')
                    .eq('kelas', payload.kelas)
                    .eq('tahun', payload.tahun)
                    .eq('assessment', payload.assessment)
                    .eq('jenis', payload.jenis)
                    .limit(1);

                if (findError) throw findError;

                if (existingRows && existingRows.length > 0) {
                    const { error: updateError } = await supabaseClient
                        .from('semakan_guru_kelas')
                        .update(payload)
                        .eq('id', existingRows[0].id);
                    if (updateError) throw updateError;
                } else {
                    const { error: insertError } = await supabaseClient
                        .from('semakan_guru_kelas')
                        .insert(payload);
                    if (insertError) throw insertError;
                }

                await fetchAllDataFromSupabase();
                showToast(`${jenis} ${guruKelasSelectedClass} telah dihantar ke Dashboard Admin.`, 'success');
                renderPage();
            } catch (e) {
                console.error('Gagal hantar pengesahan guru kelas:', e);
                showToast('Gagal hantar pengesahan. Pastikan jadual semakan_guru_kelas dan RLS betul.', 'danger');
            }
        }

        function renderVerificationStatus(status) {
            if (status === 'Disahkan Admin') return '<span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-100 text-[10px] font-black">DISAHKAN ADMIN</span>';

            'SEJARAH': ['Kemahiran Sejarah','Zaman Prasejarah','Kerajaan Melayu Awal','Tokoh Negara','Kemerdekaan','Institusi Raja','Identiti Negara'],
            'REKA BENTUK TEKNOLOGI': ['Reka Bentuk','Pengurusan Projek','Teknologi Pertanian','Reka Bentuk Makanan','Elektrik dan Elektronik','Pengaturcaraan Asas']
        };

        function getSismarAITopicOptions(subject) {
            return sismarAITopicsBySubject[subject] || ['Kemahiran Asas','Pengukuhan','Aplikasi','KBAT'];
        }

        function getSismarAIStudentRows(kelas = sismarAISelectedClass, subject = sismarAISelectedSubject, year = sismarAISelectedYear, assessment = sismarAISelectedAssessment) {
            return getStudentsByExactClass(kelas).map(student => {
                const key = `${student.id}_${year}_${assessment}_${subject}`;
                const rawMark = studentMarks[key];
                const mark = rawMark === undefined || rawMark === '' ? null : Number(rawMark);
                const pbd = String(studentPBD[key] || '').toUpperCase();
                const tpNumber = Number((pbd.match(/\d+/) || [0])[0]);
                let risk = 'Belum Cukup Data';
                if (Number.isFinite(mark) || tpNumber) {
                    if ((Number.isFinite(mark) && mark < 40) || (tpNumber > 0 && tpNumber <= 2)) risk = 'Risiko Tinggi';
                    else if ((Number.isFinite(mark) && mark < 65) || tpNumber === 3) risk = 'Risiko Sederhana';
                    else risk = 'Risiko Rendah';
                }
                return { id: student.id, nama: student.nama, kelas: student.kelas, mark, pbd: pbd || '-', risk };
            }).filter(row => row.mark !== null || row.pbd !== '-');
        }

        function getSismarAISnapshot() {
            const rows = getSismarAIStudentRows();
            const marks = rows.map(r => r.mark).filter(Number.isFinite);
            const average = marks.length ? marks.reduce((a, b) => a + b, 0) / marks.length : 0;
            const tpCounts = { TP1: 0, TP2: 0, TP3: 0, TP4: 0, TP5: 0, TP6: 0 };
            rows.forEach(r => { if (Object.prototype.hasOwnProperty.call(tpCounts, r.pbd)) tpCounts[r.pbd]++; });
            return {
                tahun: sismarAISelectedYear,
                assessment: sismarAISelectedAssessment,
                kelas: sismarAISelectedClass,
                subject: sismarAISelectedSubject,
                jumlahMurid: rows.length,
                jumlahMarkah: marks.length,
                purata: Number(average.toFixed(1)),
                tertinggi: marks.length ? Math.max(...marks) : 0,
                terendah: marks.length ? Math.min(...marks) : 0,
                risikoTinggi: rows.filter(r => r.risk === 'Risiko Tinggi'),
                risikoSederhana: rows.filter(r => r.risk === 'Risiko Sederhana'),
                risikoRendah: rows.filter(r => r.risk === 'Risiko Rendah'),
                tpCounts,
                murid: rows
            };
        }

                                        <input id="sismar-ai-topic" list="sismar-ai-topic-list" value="${escapeHtml(sismarAISelectedTopic)}" oninput="sismarAISelectedTopic=this.value" class="w-full p-3 border border-slate-200 rounded-xl text-xs font-semibold" placeholder="Pilih atau taip topik/kemahiran intervensi">
                                        <datalist id="sismar-ai-topic-list">${getSismarAITopicOptions(sismarAISelectedSubject).map(t => `<option value="${escapeHtml(t)}"></option>`).join('')}</datalist>

                                    <select id="sismar-ai-question-type" onchange="sismarAIQuestionType=this.value" class="p-3 border border-slate-200 rounded-xl text-xs font-bold">${['Campuran','Objektif','Struktur','Subjektif','Isi Tempat Kosong','Benar atau Salah','KBAT'].map(v => `<option value="${v}" ${v===sismarAIQuestionType?'selected':''}>${v}</option>`).join('')}</select>
                                    <select id="sismar-ai-question-count" onchange="sismarAIQuestionCount=Number(this.value)" class="p-3 border border-slate-200 rounded-xl text-xs font-bold">${[5,10,15,20,30].map(n => `<option value="${n}" ${n===sismarAIQuestionCount?'selected':''}>${n} soalan</option>`).join('')}</select>
                                </div>
                                <div class="flex flex-wrap gap-2">
                                    <button id="sismar-ai-run-btn" onclick="runSismarAI()" class="px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-black flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4"></i> JANA ANALISIS PINTAR</button>
                                    <button onclick="saveSismarAIIntervention()" class="px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-black flex items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> SIMPAN</button>
                                    <button onclick="printSismarAIResult()" class="px-4 py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-black flex items-center gap-2"><i data-lucide="printer" class="w-4 h-4"></i> CETAK</button>
                                    <button onclick="exportSismarAIResult()" class="px-4 py-3 bg-violet-600 hover:bg-violet-700 text-white rounded-xl text-xs font-black flex items-center gap-2"><i data-lucide="download" class="w-4 h-4"></i> EXPORT</button>
                                    <button onclick="copySismarAIResult()" class="px-4 py-3 border border-slate-200 rounded-xl text-xs font-black"><i data-lucide="copy" class="w-4 h-4 inline mr-1"></i> SALIN</button>
                                </div>
                                <div id="sismar-ai-output" class="min-h-[300px] whitespace-pre-wrap p-5 rounded-2xl bg-slate-50 border border-slate-100 text-sm text-slate-700 leading-relaxed">Pilih jenis analisis dan murid. Kemudian klik JANA ANALISIS PINTAR.</div>
                            </div>
                        </div>

                        <div class="space-y-5">
                            <div class="bg-white rounded-3xl border border-blue-100 shadow-sm p-5">
                                <h3 class="font-black text-slate-800 mb-3">Agihan PBD</h3>
                                <div class="grid grid-cols-3 gap-2">${Object.entries(snapshot.tpCounts).map(([tp,count]) => `<div class="p-3 rounded-xl bg-violet-50 text-center"><p class="text-xs font-black text-violet-700">${tp}</p><p class="text-xl font-black text-slate-800">${count}</p></div>`).join('')}</div>
                            </div>
                            <div class="bg-white rounded-3xl border border-rose-100 shadow-sm overflow-hidden">
                                <div class="p-5 border-b border-slate-100"><h3 class="font-black text-slate-800">Murid Perlu Tumpuan</h3></div>
                                <div class="max-h-[430px] overflow-y-auto divide-y divide-slate-100">${riskRows.length ? riskRows.map(r => `<button onclick="sismarAISelectedStudentId='${r.id}';renderPage()" class="w-full p-4 text-left hover:bg-slate-50"><div class="flex items-start justify-between gap-3"><div><p class="text-xs font-black text-slate-800">${escapeHtml(r.nama)}</p><p class="text-[10px] text-slate-500 mt-1">${escapeHtml(r.kelas)} • ${r.mark===null?'-':r.mark+'%'} • ${escapeHtml(r.pbd)}</p></div><span class="text-[9px] font-black px-2 py-1 rounded-full ${r.risk==='Risiko Tinggi'?'bg-rose-100 text-rose-700':'bg-amber-100 text-amber-700'}">${escapeHtml(r.risk)}</span></div></button>`).join('') : '<p class="p-5 text-sm text-slate-400">Tiada murid berisiko bagi tapisan ini.</p>'}</div>
                            </div>
                        </div>
                    </section>

                    ${renderSavedSismarAIInterventions()}
                </div>`;
        }

        function getSismarAIGrade(mark) {
            if (!Number.isFinite(mark)) return '-';
            if (mark >= 80) return 'A';
            if (mark >= 65) return 'B';
            if (mark >= 50) return 'C';
            if (mark >= 40) return 'D';
            if (mark >= 20) return 'E';
            return 'F';
        }

        function buildSismarAIQuestions(subject, topic, count, type, level) {
            const t = topic || getSismarAITopicOptions(subject)[0] || 'kemahiran yang dipilih';
            const total = Math.max(1, Number(count) || 10);
            const questionType = type || 'Campuran';
            const subjectTemplates = {
                'MATEMATIK': [
                    `Selesaikan satu soalan ${level} berkaitan ${t} dan tunjukkan langkah pengiraan.`,
                    `Nyatakan kaedah yang sesuai untuk menyelesaikan masalah berkaitan ${t}.`,
                    `Bina satu ayat matematik berdasarkan situasi harian yang melibatkan ${t}.`,
                    `Semak penyelesaian berikut dan jelaskan kesalahan yang mungkin berlaku dalam topik ${t}.`
                ],
                'BAHASA MELAYU': [
                    `Bina satu ayat gramatis menggunakan kemahiran ${t}.`,
                    `Kenal pasti dan betulkan kesalahan bahasa berkaitan ${t}.`,
                    `Baca petikan ringkas dan jawab soalan yang menguji ${t}.`,
                    `Terangkan penggunaan ${t} dalam konteks ayat yang betul.`
                ],
                'BAHASA INGGERIS': [
                    `Construct a correct sentence using ${t}.`,
                    `Choose the best answer for a question about ${t}.`,
                    `Correct the language error related to ${t}.`,
                    `Read a short situation and respond using ${t}.`
                ],
                'SAINS': [
                    `Nyatakan satu fakta penting berkaitan ${t}.`,
                    `Jelaskan sebab dan kesan bagi satu situasi berkaitan ${t}.`,
                    `Cadangkan satu penyiasatan mudah untuk menguji konsep ${t}.`,
                    `Ramalkan keputusan satu eksperimen berkaitan ${t} dan berikan alasan.`
                ]
            };
            const generic = [
                `Nyatakan maksud atau konsep asas bagi ${t}.`,
                `Berikan satu contoh yang betul berkaitan ${t}.`,
                `Terangkan langkah atau proses berkaitan ${t}.`,
                `Aplikasikan pengetahuan ${t} dalam satu situasi harian.`
            ];
            const templates = subjectTemplates[subject] || generic;
            const objectiveOptions = ['A. Pilihan 1', 'B. Pilihan 2', 'C. Pilihan 3', 'D. Pilihan 4'];
            return Array.from({length: total}, (_, i) => {
                const base = templates[i % templates.length];
                const qNo = i + 1;
                if (questionType === 'Objektif' || (questionType === 'Campuran' && i % 4 === 0)) return `${qNo}. ${base}\n   ${objectiveOptions.join('   ')}`;
                if (questionType === 'Isi Tempat Kosong' || (questionType === 'Campuran' && i % 4 === 1)) return `${qNo}. Lengkapkan pernyataan berikut berkaitan ${t}: ______________________________.`;
                if (questionType === 'Benar atau Salah') return `${qNo}. Tandakan BENAR atau SALAH bagi pernyataan berkaitan ${t}: ______________________________.`;
                if (questionType === 'KBAT' || (questionType === 'Campuran' && i % 4 === 3)) return `${qNo}. ${base} Berikan alasan dan bukti yang menyokong jawapan anda.`;
                return `${qNo}. ${base}`;
            }).join('\n\n');
        }

        function buildLocalSismarAIResponse(mode, snapshot, student, topic) {
            const riskNames = snapshot.risikoTinggi.slice(0, 10).map((r,i) => `${i+1}. ${r.nama} (${r.mark===null?'-':r.mark+'%'}, ${r.pbd})`).join('\n') || 'Tiada murid risiko tinggi.';
            const marks = snapshot.murid.map(r => r.mark).filter(Number.isFinite);
            const lulus = marks.filter(v => v >= 40).length;
            const gagal = marks.filter(v => v < 40).length;
            const lulusPct = marks.length ? ((lulus / marks.length) * 100).toFixed(1) : '0.0';
            const gagalPct = marks.length ? ((gagal / marks.length) * 100).toFixed(1) : '0.0';
            const gradeCounts = {A:0,B:0,C:0,D:0,E:0,F:0};
            marks.forEach(v => { const g = getSismarAIGrade(v); if (gradeCounts[g] !== undefined) gradeCounts[g]++; });

            if (mode === 'kelas') return `ANALISIS KELAS\n\nKelas: ${snapshot.kelas}\nPentaksiran: ${snapshot.assessment}\nJumlah murid dianalisis: ${snapshot.jumlahMurid}\nJumlah mempunyai markah: ${snapshot.jumlahMarkah}\nPurata kelas: ${snapshot.purata}%\nMarkah tertinggi: ${snapshot.tertinggi}%\nMarkah terendah: ${snapshot.terendah}%\nLulus: ${lulus} (${lulusPct}%)\nGagal: ${gagal} (${gagalPct}%)\nRisiko tinggi: ${snapshot.risikoTinggi.length}\nRisiko sederhana: ${snapshot.risikoSederhana.length}\n\nAGIHAN GRED\nA: ${gradeCounts.A} | B: ${gradeCounts.B} | C: ${gradeCounts.C} | D: ${gradeCounts.D} | E: ${gradeCounts.E} | F: ${gradeCounts.F}\n\nMURID KEUTAMAAN\n${riskNames}\n\nCADANGAN TINDAKAN\n1. Kelompokkan murid mengikut tahap keperluan.\n2. Jalankan intervensi berfokus selama dua minggu.\n3. Gunakan latihan berperingkat dan maklum balas segera.\n4. Laksanakan pentaksiran semula dan bandingkan peningkatan.`;

            if (mode === 'pbd') return `ANALISIS PBD\n\nKelas: ${snapshot.kelas}\nSubjek: ${snapshot.subject}\nPentaksiran: ${snapshot.assessment}\nTP1: ${snapshot.tpCounts.TP1}\nTP2: ${snapshot.tpCounts.TP2}\nTP3: ${snapshot.tpCounts.TP3}\nTP4: ${snapshot.tpCounts.TP4}\nTP5: ${snapshot.tpCounts.TP5}\nTP6: ${snapshot.tpCounts.TP6}\n\nINTERPRETASI\nMurid TP1 dan TP2 memerlukan pemulihan berstruktur. Murid TP3 memerlukan pengukuhan. Murid TP4 hingga TP6 sesuai menerima aktiviti aplikasi, pengayaan dan KBAT.\n\nTINDAKAN PBD\n1. Tetapkan kemahiran khusus yang belum dikuasai.\n2. Gunakan bahan visual, manipulatif atau demonstrasi.\n3. Rekod evidens semasa aktiviti.\n4. Nilai semula selepas intervensi dan kemas kini TP hanya melalui modul PBD asal.`;

            if (!student) return 'Sila pilih murid yang mempunyai data markah atau PBD.';
            const level = (student.mark !== null && student.mark < 40) || ['TP1','TP2'].includes(student.pbd) ? 'asas dan berpandu' : (student.mark !== null && student.mark < 65) || student.pbd === 'TP3' ? 'pengukuhan sederhana' : 'aplikasi dan pengayaan';

            if (mode === 'soalan') {
                const t = topic || getSismarAITopicOptions(snapshot.subject)[0] || 'kemahiran yang dipilih oleh guru';
                const questions = buildSismarAIQuestions(snapshot.subject, t, sismarAIQuestionCount, sismarAIQuestionType, level);
                return `SET SOALAN INTERVENSI\n\nNama: ${student.nama}\nKelas: ${student.kelas}\nSubjek: ${snapshot.subject}\nPentaksiran: ${snapshot.assessment}\nMarkah: ${student.mark===null?'-':student.mark+'%'}\nPBD: ${student.pbd}\nTopik: ${t}\nJenis Soalan: ${sismarAIQuestionType}\nTahap: ${level}\nBilangan: ${sismarAIQuestionCount}\n\nARAHAN\nJawab semua soalan. Guru perlu menyemak kesesuaian kandungan dengan DSKP dan topik sebenar sebelum digunakan.\n\n${questions}\n\nSKEMA / PANDUAN PEMARKAHAN\n1. Terima jawapan yang tepat dari segi fakta, konsep dan langkah.\n2. Bagi soalan objektif, guru tetapkan pilihan jawapan sebenar mengikut kandungan yang diajar.\n3. Bagi soalan struktur atau KBAT, berikan markah pada fakta, huraian, langkah dan alasan.\n4. Gunakan hasil latihan sebagai evidens intervensi, bukan sebagai pengganti rekod markah asal.`;
            }

            if (mode === 'intervensi') return `PELAN INTERVENSI INDIVIDU\n\nNama Murid: ${student.nama}\nKelas: ${student.kelas}\nSubjek: ${snapshot.subject}\nPentaksiran: ${snapshot.assessment}\nMarkah Awal: ${student.mark===null?'-':student.mark+'%'}\nPBD Awal: ${student.pbd}\nKategori: ${student.risk}\nTopik/Kemahiran: ${topic || 'Perlu ditetapkan oleh guru'}\n\nDIAGNOSIS\nMurid memerlukan intervensi ${level} berdasarkan markah pentaksiran dan PBD yang direkodkan.\n\nOBJEKTIF\nMurid menunjukkan peningkatan sekurang-kurangnya 20 mata peratus atau meningkat satu tahap penguasaan selepas intervensi.\n\nAKTIVITI\n1. Bimbingan kumpulan kecil selama 20 minit.\n2. Penerangan semula menggunakan contoh mudah dan bahan visual.\n3. Latihan berperingkat daripada aras asas kepada aplikasi.\n4. Maklum balas segera dan pembetulan kesalahan.\n5. Ujian pasca selepas dua minggu.\n\nTEMPOH\nDua minggu, tiga sesi seminggu.\n\nINDIKATOR KEJAYAAN\nMencapai sekurang-kurangnya 70% atau meningkat satu TP.\n\nTINDAKAN SUSULAN\nRekod markah pasca secara berasingan, semak perkembangan dan sambung intervensi jika sasaran belum dicapai.`;

            return `ANALISIS SUBJEK\n\nSubjek: ${snapshot.subject}\nKelas: ${snapshot.kelas}\nPentaksiran: ${snapshot.assessment}\nJumlah murid dianalisis: ${snapshot.jumlahMurid}\nPurata: ${snapshot.purata}%\nTertinggi: ${snapshot.tertinggi}%\nTerendah: ${snapshot.terendah}%\nLulus: ${lulus} (${lulusPct}%)\nGagal: ${gagal} (${gagalPct}%)\nRisiko tinggi: ${snapshot.risikoTinggi.length}\nRisiko sederhana: ${snapshot.risikoSederhana.length}\n\nAGIHAN GRED\nA: ${gradeCounts.A} | B: ${gradeCounts.B} | C: ${gradeCounts.C} | D: ${gradeCounts.D} | E: ${gradeCounts.E} | F: ${gradeCounts.F}\n\nMURID KEUTAMAAN\n${riskNames}\n\nCADANGAN INTERVENSI SUBJEK\n1. Kenal pasti topik atau kemahiran yang paling lemah.\n2. Sediakan latihan diagnostik pendek.\n3. Jalankan pemulihan untuk risiko tinggi dan pengukuhan untuk risiko sederhana.\n4. Sediakan pengayaan atau KBAT kepada murid risiko rendah.\n5. Nilai semula selepas dua minggu dan dokumentasikan perubahan.`;
        }

        async function runSismarAI() {
            const output = document.getElementById('sismar-ai-output');
            const btn = document.getElementById('sismar-ai-run-btn');
            const mode = document.getElementById('sismar-ai-mode')?.value || sismarAISelectedMode;
            const topic = document.getElementById('sismar-ai-topic')?.value.trim() || sismarAISelectedTopic;
            const snapshot = getSismarAISnapshot();
            const student = getSismarAISelectedStudent();
            sismarAISelectedMode = mode;
            sismarAISelectedTopic = topic;
            if (output) output.textContent = 'SISMAR AI sedang membaca markah, PBD dan menjana analisis...';
            if (btn) { btn.disabled = true; btn.classList.add('opacity-60'); }
            let aiText = '';
            try {
                if (supabaseEnabled && supabaseClient && ['subjek','kelas','pbd'].includes(mode)) {
                    const { data, error } = await supabaseClient.functions.invoke(SISMAR_AI_FUNCTION_NAME, {
                        body: {
                            mode, kelas: snapshot.kelas, tahun: snapshot.tahun, subject: snapshot.subject,
                            assessment: snapshot.assessment, topic, question_count: sismarAIQuestionCount,
                            question_type: sismarAIQuestionType, student: student || null, snapshot
                        }
                    });
                    if (!error && data?.success && data?.analisis) aiText = data.analisis;
                }
            } catch (err) { console.warn('Edge Function AI tidak dapat digunakan. Analisis tempatan digunakan.', err); }
            const localText = buildLocalSismarAIResponse(mode, snapshot, student, topic);
            sismarAIResult = aiText ? `${aiText}\n\n--- DATA DAN TINDAKAN SISMAR ---\n${localText}` : localText;
            if (output) output.textContent = sismarAIResult;
            if (btn) { btn.disabled = false; btn.classList.remove('opacity-60'); }
            showToast('Analisis SISMAR AI berjaya dijana.', 'success');
        }

        function saveSismarAIIntervention() {
            const student = getSismarAISelectedStudent();
            if (!sismarAIResult) { showToast('Jana analisis atau intervensi dahulu.', 'warning'); return; }
            const rows = readSismarAIInterventions();
            rows.unshift({
                id: Date.now(), student_id: student?.id || '', student_name: student?.nama || 'Analisis Kelas',
                kelas: sismarAISelectedClass, tahun: sismarAISelectedYear, assessment: sismarAISelectedAssessment,
                subject: sismarAISelectedSubject, mark: student?.mark ?? '', pbd: student?.pbd || '',
                mode: sismarAISelectedMode, topic: sismarAISelectedTopic, result: sismarAIResult,
                teacher: currentUser?.name || '', created_at: new Date().toISOString()
            });
            writeSismarAIInterventions(rows);
            showToast('Intervensi berjaya disimpan tanpa mengubah markah.', 'success');
            renderPage();
        }

        function deleteSismarAIIntervention(id) {
            const rows = readSismarAIInterventions().filter(r => String(r.id) !== String(id));
            writeSismarAIInterventions(rows);
            showToast('Rekod intervensi dipadam. Markah dan PBD tidak terjejas.', 'success');
            renderPage();
        }

        function renderSavedSismarAIInterventions() {
            const rows = readSismarAIInterventions().slice(0, 20);
            return `<section class="bg-white rounded-3xl border border-emerald-100 shadow-sm overflow-hidden"><div class="p-5 border-b border-slate-100 flex items-center justify-between"><div><h3 class="font-black text-slate-800">Rekod Intervensi Disimpan</h3><p class="text-xs text-slate-500">Rekod berasingan. Tidak mengubah jadual marks atau pbd.</p></div></div><div class="overflow-x-auto"><table class="w-full text-xs"><thead class="bg-slate-50"><tr><th class="p-3 text-left">Murid</th><th class="p-3 text-left">Subjek</th><th class="p-3 text-left">Jenis</th><th class="p-3 text-left">Tarikh</th><th class="p-3 text-center">Tindakan</th></tr></thead><tbody class="divide-y divide-slate-100">${rows.length ? rows.map(r => `<tr><td class="p-3 font-bold">${escapeHtml(r.student_name)}<div class="text-[10px] text-slate-400">${escapeHtml(r.kelas)}</div></td><td class="p-3">${escapeHtml(r.subject)}</td><td class="p-3 uppercase font-bold text-blue-700">${escapeHtml(r.mode)}</td><td class="p-3">${new Date(r.created_at).toLocaleString('ms-MY')}</td><td class="p-3 text-center"><button onclick="loadSismarAIIntervention(${r.id})" class="px-3 py-1.5 bg-blue-50 text-blue-700 rounded-lg font-black mr-1">BUKA</button><button onclick="deleteSismarAIIntervention(${r.id})" class="px-3 py-1.5 bg-rose-50 text-rose-700 rounded-lg font-black">PADAM</button></td></tr>`).join('') : '<tr><td colspan="5" class="p-6 text-center text-slate-400">Belum ada intervensi disimpan.</td></tr>'}</tbody></table></div></section>`;
        }

        function loadSismarAIIntervention(id) {
            const row = readSismarAIInterventions().find(r => String(r.id) === String(id));
            if (!row) return;
            sismarAIResult = row.result || '';
            const output = document.getElementById('sismar-ai-output');
            if (output) { output.textContent = sismarAIResult; output.scrollIntoView({behavior:'smooth', block:'center'}); }
        }

        function copySismarAIResult() {
            const text = sismarAIResult || document.getElementById('sismar-ai-output')?.innerText || '';
            if (!text) { showToast('Tiada analisis untuk disalin.', 'warning'); return; }
            navigator.clipboard.writeText(text).then(() => showToast('Analisis AI telah disalin.', 'success'));
        }

        function exportSismarAIResult() {
            const text = sismarAIResult || document.getElementById('sismar-ai-output')?.innerText || '';
            if (!text) { showToast('Tiada analisis untuk dieksport.', 'warning'); return; }
            const student = getSismarAISelectedStudent();
            const filename = `SISMAR_AI_${sismarAISelectedMode}_${student?.nama || sismarAISelectedClass}_${sismarAISelectedSubject}.txt`.replace(/[^a-zA-Z0-9_.-]+/g,'_');
            const blob = new Blob(['\ufeff' + text], {type:'text/plain;charset=utf-8'});
            const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
            showToast('Analisis berjaya dieksport.', 'success');
        }

        function printSismarAIResult() {
            const text = sismarAIResult || document.getElementById('sismar-ai-output')?.innerText || '';
            if (!text) { showToast('Tiada analisis untuk dicetak.', 'warning'); return; }
            const student = getSismarAISelectedStudent();
            const w = window.open('', '_blank');
            if (!w) { showToast('Benarkan pop-up untuk mencetak.', 'warning'); return; }
            w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>SISMAR AI</title><style>body{font-family:Arial;padding:28px;color:#111}h1{text-align:center;font-size:20px}p{font-size:12px}.meta{border:1px solid #000;padding:10px;margin:12px 0}.result{white-space:pre-wrap;line-height:1.6;font-size:13px}@page{size:A4;margin:15mm}</style></head><body><h1>SISMAR AI SMART INTERVENTION</h1><div class="meta"><b>Nama:</b> ${escapeHtml(student?.nama || 'Analisis Kelas')}<br><b>Kelas:</b> ${escapeHtml(sismarAISelectedClass)}<br><b>Subjek:</b> ${escapeHtml(sismarAISelectedSubject)}<br><b>Pentaksiran:</b> ${escapeHtml(sismarAISelectedAssessment)}<br><b>Guru:</b> ${escapeHtml(currentUser?.name || '')}</div><div class="result">${escapeHtml(text)}</div><p style="margin-top:50px">Tandatangan Guru: _______________________ &nbsp;&nbsp;&nbsp; Pengesahan Pentadbir: _______________________</p></body></html>`);
            w.document.close(); w.focus(); w.print();
        }

        async function loadResourceLinksFromSupabase(type, force = false) {
            const storageKey = type === 'bank' ? SISMAR_BANK_LINKS_KEY : SISMAR_REKOD_LINKS_KEY;
            if (!force && (resourceLinksLoaded[type] || resourceLinksLoading[type])) return;
            if (!supabaseEnabled || !supabaseClient || !currentUser) return;

            resourceLinksLoading[type] = true;
            try {
                const { data, error } = await supabaseClient
                    .from(SISMAR_RESOURCE_TABLE)
                    .select('resource_type,subject,url,updated_at')
                    .eq('resource_type', type)
                    .order('subject', { ascending: true });

                if (error) throw error;

                const links = {};
                (data || []).forEach(row => {
                    if (row.subject && row.url) links[row.subject] = row.url;
                });
                cacheResourceLinks(storageKey, links);
                resourceLinksLoaded[type] = true;

                if ((type === 'bank' && currentPage === 'bank_soalan') ||
                    (type === 'rekod' && currentPage === 'rekod_perkembangan_murid')) {
                    renderSubjectResourcePage(type);
                    lucide.createIcons();
                }
            } catch (e) {
                console.error('Gagal mengambil pautan daripada Supabase:', e);
                // Kekalkan cache tempatan supaya paparan dan pautan tidak hilang.
                showToast('Pautan Supabase belum dapat dibaca. Cache tempatan masih digunakan.', 'warning');
            } finally {
                resourceLinksLoading[type] = false;
            }
        }

        async function saveResourceLink(storageKey, subject, inputId) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const url = String(input.value || '').trim();
            if (url && !/^https?:\/\//i.test(url)) {
                showToast('Pautan mesti bermula dengan http:// atau https://', 'warning');
                return;
            }

            const type = getResourceTypeFromStorageKey(storageKey);
            const links = readResourceLinks(storageKey);
            const previousUrl = links[subject] || '';

            // Simpan cache dahulu agar pautan kekal walaupun rangkaian terputus.
            if (url) links[subject] = url;
            else delete links[subject];
            cacheResourceLinks(storageKey, links);

            if (!supabaseEnabled || !supabaseClient) {
                showToast('Pautan disimpan dalam peranti. Sambungan Supabase tidak tersedia.', 'warning');
                renderSubjectResourcePage(type);
                lucide.createIcons();
                return;
            }

            try {
                if (url) {
                    const authResult = await supabaseClient.auth.getUser();
                    const userEmail = authResult?.data?.user?.email || currentUser?.email || '';
                    const { error } = await supabaseClient
                        .from(SISMAR_RESOURCE_TABLE)
                        .upsert({
                            resource_type: type,
                            subject,
                            url,
                            updated_by: userEmail,
                            updated_at: new Date().toISOString()
                        }, { onConflict: 'resource_type,subject' });
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient
                        .from(SISMAR_RESOURCE_TABLE)
                        .delete()
                        .eq('resource_type', type)
                        .eq('subject', subject);
                    if (error) throw error;
                }

                resourceLinksLoaded[type] = true;
                showToast(`Pautan ${subject} telah disimpan ke Supabase.`, 'success');
            } catch (e) {
                console.error('Gagal simpan pautan ke Supabase:', e);
                // Pulihkan cache kepada nilai lama supaya status skrin tepat.
                if (previousUrl) links[subject] = previousUrl;

        let teacherAnalysisCharts = {};
