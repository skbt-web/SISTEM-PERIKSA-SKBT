        function normalizeTeacherName(value) {
            return String(value || '')
                .toUpperCase()
                .replace(/\b(PN|PUAN|EN|ENCIK|CIK|HJH|HJ|BT|BIN|BINTI)\.?\b/g, '')
                .replace(/[^A-Z0-9]/g, '')
                .trim();
        }


        // Padanan kelas yang selamat.
        // Tujuan: Setiap kelas diproses secara berasingan.
        // Contoh: 4 AR-RAZI tidak bercampur dengan 4 AL-KHAWARIZMI.
        // Data lama yang ada beza tanda '-' atau jarak masih boleh dibaca.
        function normalizeClassName(value) {
            return String(value || '')
                .toUpperCase()
                .replace(/AL\s*-?\s*KHAWARIZMI/g, 'AL KHAWARIZMI')
                .replace(/AR\s*-?\s*RAZI/g, 'AR RAZI')
                .replace(/[^A-Z0-9]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function getClassYearOnly(value) {
            const match = normalizeClassName(value).match(/^(\d+)/);
            return match ? match[1] : '';
        }

        function getClassStreamOnly(value) {
            const normalized = normalizeClassName(value);

            if (/(^|\s)AL\s+KHAWARIZMI($|\s)/.test(normalized)) {
                return 'AL KHAWARIZMI';
            }

            if (/(^|\s)AR\s+RAZI($|\s)/.test(normalized)) {

            return '';

            const hasArRazi = /(^|\s)AR\s+RAZI($|\s)/.test(normalized);
            return hasAlKhawarizmi && hasArRazi;
        }

            if (!value || !targetClass) return false;

            // Tanda sempang dan jarak masih dibenarkan kerana normalizeClassName sudah menyeragamkannya.
            return valueClass === targetClassName;
        }

            const normalized = normalizeClassName(value);
            const match = classes.find(c => normalizeClassName(c) === normalized);
            return match || String(value || '').toUpperCase().trim();

        function getAssessmentCache(cacheKey) {
            try {
                return JSON.parse(localStorage.getItem(cacheKey) || '{}') || {};
            } catch (e) {
                console.warn('Cache markah tidak dapat dibaca:', e);
                return {};
            }
        }

        function cacheAssessmentRows(cacheKey, rows) {
            if (!rows || rows.length === 0) return;
            const cache = getAssessmentCache(cacheKey);
            rows.forEach(row => {
                if (row && row.key) cache[row.key] = row;
            });
            localStorage.setItem(cacheKey, JSON.stringify(cache));
        }

        function mergeAssessmentCacheToMemory(cacheKey, memoryObject, statusArray) {
            const cache = getAssessmentCache(cacheKey);
            Object.values(cache).forEach(row => {
                if (!row || !row.key) return;
                memoryObject[row.key] = row.value;
                const idx = statusArray.findIndex(item => item && item.key === row.key);
                if (idx >= 0) statusArray[idx] = { ...statusArray[idx], ...row };
                else statusArray.push(row);
            });
        }

                subject: parts.slice(3).join('_') || ''

        async function initSupabase() {
            try {
                if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('PASTE_')) {
                    console.warn('Supabase URL / Anon Key belum lengkap. Sistem berjalan dalam mod tempatan.');
                    supabaseEnabled = false;
                    return;
                }

                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                });

                supabaseEnabled = true;

                // Jangan ambil data sebelum login kerana RLS hanya benarkan pengguna authenticated.
                const { data: sessionData } = await supabaseClient.auth.getSession();
                if (sessionData && sessionData.session) {
                    await fetchAllDataFromSupabase();
                }

                console.log('Supabase initialized successfully');
            } catch (e) {
                supabaseEnabled = false;
                console.error('Supabase connection error:', e);
            }
        }

                    .from('students')

                    .order('kelas', { ascending: true })
                    .order('nama', { ascending: true });

                if (studentError) throw studentError;
                if (studentRows && studentRows.length > 0) {
                    students.length = 0;
                    studentRows.forEach(row => {
                        students.push({
                            id: row.id,
                            nama: row.nama,
                            ic: row.ic,
                            kelas: row.kelas
                        });

                    .from('marks')

                if (markRows) {

        async function persistMarksBulkToSupabase(markRows, pbdRows) {
            if (!supabaseEnabled || !supabaseClient) {
                showToast('Supabase belum aktif. Data pada skrin dikekalkan.', 'warning');
                return { ok: false, marksSaved: 0, pbdSaved: 0, failed: (markRows.length + pbdRows.length) };
            }

            // Simpan dahulu dalam cache tempatan supaya tidak hilang jika refresh berlaku.
            cacheAssessmentRows(SISMAR_MARK_DRAFT_CACHE_KEY, markRows || []);
            cacheAssessmentRows(SISMAR_PBD_DRAFT_CACHE_KEY, pbdRows || []);

            const saveRowsOneByOne = async (tableName, rows) => {
                let saved = 0;
                let failed = 0;

                for (const row of rows || []) {
                    try {
                        // Guna PRIMARY KEY "key" supaya klik Simpan banyak kali akan UPDATE rekod yang sama, bukan bertindan.
                        const { error } = await supabaseClient
                            .from(tableName)
                            .upsert(row, { onConflict: 'key' });

                        if (error) {
                            failed++;
                            console.error(`Gagal simpan ${tableName}:`, row, error);
                        } else {
                            saved++;
                        }
                    } catch (err) {
                        failed++;
                        console.error(`Ralat simpan ${tableName}:`, row, err);
                    }
                }

                return { saved, failed };
            };

            const markResult = await saveRowsOneByOne('marks', markRows || []);
            const pbdResult = await saveRowsOneByOne('pbd', pbdRows || []);
            const totalFailed = markResult.failed + pbdResult.failed;

            if (totalFailed > 0) {
                showToast(`Sebahagian data gagal disimpan. Markah berjaya: ${markResult.saved}/${(markRows || []).length}, PBD berjaya: ${pbdResult.saved}/${(pbdRows || []).length}. Data pada skrin dikekalkan.`, 'warning');
                return { ok: false, marksSaved: markResult.saved, pbdSaved: pbdResult.saved, failed: totalFailed };
            }

            return { ok: true, marksSaved: markResult.saved, pbdSaved: pbdResult.saved, failed: 0 };
        }

        // --- FUNGSI JANA RUMUSAN AUTOMATIK ---
        function generateAutomaticSummary(stats) {
            let bestSubject = '-';
            let bestScore = -1;
            let weakestSubject = '-';
            let weakestScore = 9999;

            baseSubjects.forEach(sub => {
                const data = stats[sub]['JUMLAH'];
                if (data.Total > 0) {
                    const menguasai = data.TP3 + data.TP4 + data.TP5 + data.TP6;
                    const pct = (menguasai / data.Total) * 100;
                    if (pct > bestScore) {
                        bestScore = pct;
                        bestSubject = sub;
                    }
                    if (pct < weakestScore) {
                        weakestScore = pct;
                        weakestSubject = sub;
                    }
                }
            });

            if (bestScore === -1) bestSubject = "Tiada Data";
            if (weakestScore === 9999) weakestSubject = "Tiada Data";

            return {
                bestSubject,
                weakestSubject,
                bestClass: "1 AR-RAZI",
                interventionClass: "1 AL-KHAWARIZMI",
                suggestions: [
                    "Menjalankan bimbingan berfokus (PLC) bagi subjek " + (weakestSubject !== "Tiada Data" ? weakestSubject : "yang dikenal pasti lemah") + ".",
                    "Memantapkan pelaksanaan aktiviti interaktif dan intervensi dalam bilik darjah.",
                    "Sesi perkongsian amalan terbaik di antara guru pentaksir subjek utama."
                ]
            };
        }

        // --- GRADES MATH ---
        function calculateUASAGrade(score) {
            if (score === null || score === undefined || score === '') {
                return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
            }
            const num = parseFloat(score);
            if (num >= 82 && num <= 100) return { grade: 'A', color: 'text-blue-700 bg-blue-50 border-blue-200', label: 'CEMERLANG' };
            if (num >= 66 && num <= 81) return { grade: 'B', color: 'text-cyan-700 bg-cyan-50 border-cyan-200', label: 'KEPUJIAN' };
            if (num >= 50 && num <= 65) return { grade: 'C', color: 'text-amber-700 bg-amber-50 border-amber-200', label: 'MEMUASKAN' };
            if (num >= 35 && num <= 49) return { grade: 'D', color: 'text-orange-700 bg-orange-50 border-orange-200', label: 'MENCAPAI TAHAP MINIMUM' };
            if (num >= 1 && num <= 34) return { grade: 'E', color: 'text-rose-700 bg-rose-50 border-rose-200', label: 'BELUM MENCAPAI TAHAP MINIMUM' };
            if (num === 0) return { grade: 'F', color: 'text-red-700 bg-red-100 border-red-300', label: 'TIDAK MENGUASAI' };
            return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
        }

        // --- SUBMIT AND PERSIST ASSESSMENT ---
        async function saveMarks(silent = false) {
            const rows = document.querySelectorAll('.student-row');
            let successCount = 0;
            const markRows = [];
            const pbdRows = [];

            for (const row of rows) {
                const sId = row.getAttribute('data-id');
                const markInput = row.querySelector('.mark-input');
                const pbdSelect = row.querySelector('.pbd-select');
                const key = `${sId}_${selectedYear}_${selectedAssessment}_${selectedSubject}`;
                const keyInfo = parseKey(key);

                if (markInput) {
                    const markVal = markInput.value.trim();

                    // Jangan padam markah lama jika ruang kosong.
                    if (markVal !== '') {
                        const num = parseFloat(markVal);
                        if (!isNaN(num) && num >= 0 && num <= 100) {
                            const markRow = {
                                key,
                                student_id: String(keyInfo.student_id),
                                tahun: keyInfo.tahun,
                                assessment: keyInfo.assessment,
                                subject: keyInfo.subject,
                                value: num,
                                teacher_email: currentUser ? currentUser.email : null,
                                teacher_name: selectedTeacher,
                                kelas: canonicalClassName(selectedClass),
                                updated_at: new Date().toISOString()
                            };
                            studentMarks[key] = num;
                            markRows.push(markRow);
                            successCount++;
                        }
                    }
                }

                if (pbdSelect) {
                    const pbdVal = pbdSelect.value;

                    // Jangan padam PBD lama jika pilihan kosong.
                    if (pbdVal) {
                        const pbdRow = {
                            key,
                            student_id: String(keyInfo.student_id),
                            tahun: keyInfo.tahun,
                            assessment: keyInfo.assessment,
                            subject: keyInfo.subject,
                            value: pbdVal,
                            teacher_email: currentUser ? currentUser.email : null,
                            teacher_name: selectedTeacher,
                            kelas: canonicalClassName(selectedClass),
                            updated_at: new Date().toISOString()
                        };
                        studentPBD[key] = pbdVal;
                        pbdRows.push(pbdRow);
                    }
                }
            }

            if (markRows.length === 0 && pbdRows.length === 0) {
                if (!silent) showToast('Tiada markah atau PBD baharu untuk disimpan.', 'info');
                renderPage();
                return false;
            }

            // Cache dahulu sebelum panggilan Supabase. Ini elak data hilang selepas render/refresh.
            cacheAssessmentRows(SISMAR_MARK_DRAFT_CACHE_KEY, markRows);
            cacheAssessmentRows(SISMAR_PBD_DRAFT_CACHE_KEY, pbdRows);

            const result = await persistMarksBulkToSupabase(markRows, pbdRows);

            if (result && result.ok) {
                await fetchAllDataFromSupabase();
                mergeAssessmentCacheToMemory(SISMAR_MARK_DRAFT_CACHE_KEY, studentMarks, markStatusRows);
                mergeAssessmentCacheToMemory(SISMAR_PBD_DRAFT_CACHE_KEY, studentPBD, pbdStatusRows);
                if (!silent) {
                    showToast(`Selesai menyimpan ${result.marksSaved} rekod markah dan ${result.pbdSaved} rekod PBD ke Supabase.`, 'success');
                }
            } else {
                // Jangan ambil data kosong dari Supabase. Kekalkan data yang guru baru isi.
                mergeAssessmentCacheToMemory(SISMAR_MARK_DRAFT_CACHE_KEY, studentMarks, markStatusRows);
                mergeAssessmentCacheToMemory(SISMAR_PBD_DRAFT_CACHE_KEY, studentPBD, pbdStatusRows);
            }

            renderPage();
            return !!(result && result.ok);
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = text.split('\n');
                tempUploadedStudents = [];

                for (let i = 1; i < rows.length; i++) {
                    const columns = rows[i].split(',');
                    if (columns.length >= 3) {
                        const nama = columns[0].trim().toUpperCase();
                        const ic = columns[1].trim();
                        const kelas = canonicalClassName(columns[2].trim());

                        if (nama && ic && kelas) {
                            tempUploadedStudents.push({ nama, ic, kelas });
                        }
                    }
                }

                const infoBox = document.getElementById('csv-preview-info');
                if (infoBox) {
                    infoBox.innerText = `Menjumpai ${tempUploadedStudents.length} murid sedia untuk diimport.`;
                    infoBox.classList.remove('hidden');
                }
                showToast(`Selesai memuat fail. Sila klik SIMPAN untuk memasukkannya ke sistem.`, 'info');
            };
            reader.readAsText(file);
        }

        async function saveCSVData() {
            if (tempUploadedStudents.length === 0) {
                showToast('Tiada data fail CSV dikesan. Sila pilih fail terlebih dahulu.', 'warning');
                return;
            }

            let importCount = 0;
            const startId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;

            for (let i = 0; i < tempUploadedStudents.length; i++) {
                const row = tempUploadedStudents[i];
                const exists = students.some(s => s.ic === row.ic);
                
                if (!exists) {
                    const studentObj = {
                        id: startId + importCount,
                        nama: row.nama,
                        ic: row.ic,
                        kelas: row.kelas
                    };
                    students.push(studentObj);
                    importCount++;
                }
            }

            const newStudentsForUpload = students.slice(students.length - importCount);
            await persistStudentsBulkToSupabase(newStudentsForUpload);

            tempUploadedStudents = [];
            const infoBox = document.getElementById('csv-preview-info');
            if (infoBox) {
                infoBox.classList.add('hidden');
            }
            const csvInput = document.getElementById('csv-file-input');
            if (csvInput) csvInput.value = '';

            showToast(`Berjaya mendaftar ${importCount} murid baharu ke sistem & Supabase!`, 'success');
            renderPage();
        }

        function buildFillingStatusRows(scope = 'admin', classFilter = null) {
            const grouped = {};
            const allRows = [
                ...(markStatusRows || []).map(row => ({ ...row, data_type: 'MARKAH' })),
                ...(pbdStatusRows || []).map(row => ({ ...row, data_type: 'PBD' }))
            ];

            const filteredRows = allRows.filter(row => {
                if (!row) return false;
                if (selectedYear && String(row.tahun) !== String(selectedYear)) return false;
                if (selectedAssessment && row.assessment !== selectedAssessment) return false;
                if (classFilter && !isSameClassOnly(row.kelas, classFilter)) return false;
                if (containsMultipleClasses(row.kelas)) return false;
                return true;
            });

            filteredRows.forEach(row => {
                const kelasName = canonicalClassName(row.kelas || '-');
                const subjectName = row.subject || '-';
                const teacherName = row.teacher_name || row.teacher_email || '-';
                const teacherEmail = cleanEmail(row.teacher_email || '');
                const assessmentName = row.assessment || '-';
                const tahunName = row.tahun || selectedYear;
                const key = [tahunName, assessmentName, normalizeClassName(kelasName), subjectName, teacherEmail || normalizeTeacherName(teacherName)].join('||');

                if (!grouped[key]) {
                    grouped[key] = {
                        tahun: tahunName,
                        assessment: assessmentName,
                        kelas: kelasName,
                        subject: subjectName,
                        teacher_name: teacherName,
                        teacher_email: row.teacher_email || '-',
                        markStudentIds: new Set(),
                        pbdStudentIds: new Set(),
                        allStudentIds: new Set(),
                        updated_at: row.updated_at || row.tarikh || null
                    };
                }

                if (row.student_id) {
                    grouped[key].allStudentIds.add(String(row.student_id));
                    if (row.data_type === 'MARKAH') grouped[key].markStudentIds.add(String(row.student_id));
                    if (row.data_type === 'PBD') grouped[key].pbdStudentIds.add(String(row.student_id));
                }

                const rowDate = row.updated_at || row.tarikh || null;
                if (rowDate && (!grouped[key].updated_at || new Date(rowDate) > new Date(grouped[key].updated_at))) {
                    grouped[key].updated_at = rowDate;
                }
            });

            const result = Object.values(grouped).map(item => {
                const total = getClassStudentCount(item.kelas);
                const markCompleted = item.markStudentIds.size;
                const pbdCompleted = item.pbdStudentIds.size;
                const completed = item.allStudentIds.size;
                const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
                let status = 'BELUM MULA';
                if (completed > 0 && completed < total) status = 'SEBAHAGIAN';
                if (total > 0 && completed >= total) status = 'SIAP';
                return { ...item, total, completed, markCompleted, pbdCompleted, percent, status };
            });

            return result.sort((a, b) => {
                return (a.kelas + a.subject + a.teacher_name).localeCompare(b.kelas + b.subject + b.teacher_name);
            });
        }

        async function updateRowsForTable(tableName, oldPayload, newPayload) {
            const oldEmail = cleanEmail(oldPayload.teacher_email);
            let query = supabaseClient
                .from(tableName)
                .select('student_id,tahun,assessment,subject,kelas,teacher_email,teacher_name')
                .eq('tahun', String(oldPayload.tahun))
                .eq('assessment', oldPayload.assessment)
                .eq('subject', oldPayload.subject)
                .eq('kelas', oldPayload.kelas);

            if (oldEmail && oldEmail !== '-') {
                query = query.eq('teacher_email', oldEmail);
            } else {
                query = query.eq('teacher_name', oldPayload.teacher_name);
            }

            const { data: rows, error: selectError } = await query;
            if (selectError) throw selectError;
            if (!rows || rows.length === 0) return 0;

            let updatedCount = 0;
            for (const row of rows) {
                const newKey = `${row.student_id}_${newPayload.tahun}_${newPayload.assessment}_${newPayload.subject}`;
                let updateQuery = supabaseClient
                    .from(tableName)
                    .update({
                        key: newKey,
                        tahun: String(newPayload.tahun),
                        assessment: newPayload.assessment,
                        subject: newPayload.subject,
                        kelas: newPayload.kelas,
                        teacher_name: newPayload.teacher_name,
                        teacher_email: newPayload.teacher_email || oldPayload.teacher_email || null,
                        updated_at: new Date().toISOString()
                    })
                    .eq('student_id', String(row.student_id))
                    .eq('tahun', String(oldPayload.tahun))
                    .eq('assessment', oldPayload.assessment)
                    .eq('subject', oldPayload.subject)
                    .eq('kelas', oldPayload.kelas);

                const rowEmail = cleanEmail(row.teacher_email || oldPayload.teacher_email);
                if (rowEmail && rowEmail !== '-') {
                    updateQuery = updateQuery.eq('teacher_email', rowEmail);
                } else {
                    updateQuery = updateQuery.eq('teacher_name', oldPayload.teacher_name);
                }

                const { error: updateError } = await updateQuery;
                if (updateError) throw updateError;
                updatedCount++;
            }
            return updatedCount;
        }

        function getSlipStudent() {
            return students.find(s => String(s.id) === String(slipSelectedStudentId)) || students[0] || null;

        function getSlipGender(ic) {
            const digits = String(ic || '').replace(/\D/g, '');
            if (!digits) return '-';
            const last = parseInt(digits.charAt(digits.length - 1), 10);
            if (Number.isNaN(last)) return '-';
            return last % 2 === 0 ? 'PEREMPUAN' : 'LELAKI';
        }

        function getSlipMark(studentId, subject) {
            const key = `${studentId}_${slipSelectedYear}_${slipSelectedAssessment}_${subject}`;
            if (studentMarks[key] !== undefined && studentMarks[key] !== null && studentMarks[key] !== '') return studentMarks[key];
            const row = (markStatusRows || []).find(r =>
                String(r.student_id) === String(studentId) &&
                String(r.tahun) === String(slipSelectedYear) &&
                r.assessment === slipSelectedAssessment &&
                r.subject === subject
            );
            return row ? row.value : '';
        }

        function getSlipGrade(mark) {
            if (mark === '' || mark === null || mark === undefined) return 'E';
            const num = parseFloat(mark);
            if (Number.isNaN(num)) return 'E';
            return calculateUASAGrade(num).grade;
        }

            return `${slipSelectedAssessment} ${slipSelectedYear}`;
        }

        function getStudentTotalForSlip(student) {
            if (!student) return { total: 0, percent: 0, numericCount: 0 };
            const subjectsForSlip = getSlipSubjectsForStudent(student);
            let total = 0;
            let numericCount = 0;
            subjectsForSlip.forEach(subject => {
                const mark = getSlipMark(student.id, subject);
                const num = parseFloat(mark);
                if (!Number.isNaN(num)) {
                    total += num;
                    numericCount++;
                }
            });
            const percent = subjectsForSlip.length > 0 ? (total / (subjectsForSlip.length * 100)) * 100 : 0;
            return { total, percent, numericCount };
        }

        function getSlipClassRank(student) {
            if (!student) return '-';
            const classmates = getStudentsByExactClass(student.kelas);
            const scores = classmates.map(s => ({ id: s.id, total: getStudentTotalForSlip(s).total }))
                .sort((a, b) => b.total - a.total);
            const index = scores.findIndex(s => String(s.id) === String(student.id));
            return index >= 0 ? index + 1 : '-';
        }

        function normalizeName(value) {
            return String(value || '').trim().toUpperCase();
        }

        function getTeacherOwnStatusRows() {
            const guruName = normalizeName(currentUser?.name);
            const guruEmail = String(currentUser?.email || '').trim().toLowerCase();
            const grouped = {};

            function shouldInclude(row) {
                if (!row) return false;
                const rowEmail = String(row.teacher_email || '').trim().toLowerCase();
                const rowTeacher = normalizeName(row.teacher_name);
                if (guruEmail && rowEmail === guruEmail) return true;
                if (guruName && rowTeacher === guruName) return true;
                return false;
            }

            function ensureGroup(row) {
                const tahunName = row.tahun || selectedYear;
                const assessmentName = row.assessment || selectedAssessment;
                const kelasName = row.kelas || '-';
                const subjectName = row.subject || '-';
                const teacherName = row.teacher_name || currentUser?.name || '-';
                const key = [tahunName, assessmentName, kelasName, subjectName].join('||');

                if (!grouped[key]) {
                    grouped[key] = {
                        tahun: tahunName,
                        assessment: assessmentName,
                        kelas: kelasName,
                        subject: subjectName,
                        teacher_name: teacherName,
                        teacher_email: row.teacher_email || currentUser?.email || '-',
                        markIds: new Set(),
                        pbdIds: new Set(),
                        updated_at: row.updated_at || null
                    };
                }

                if (row.updated_at && (!grouped[key].updated_at || new Date(row.updated_at) > new Date(grouped[key].updated_at))) {
                    grouped[key].updated_at = row.updated_at;
                }

                return grouped[key];
            }

            (markStatusRows || []).filter(shouldInclude).forEach(row => {
                const g = ensureGroup(row);
                if (row.student_id && row.value !== null && row.value !== undefined && row.value !== '') {
                    g.markIds.add(String(row.student_id));
                }
            });

            (pbdStatusRows || []).filter(shouldInclude).forEach(row => {
                const g = ensureGroup(row);
                if (row.student_id && row.value !== null && row.value !== undefined && row.value !== '') {
                    g.pbdIds.add(String(row.student_id));
                }
            });

            return Object.values(grouped).map(item => {
                const total = getClassStudentCount(item.kelas);
                const markCompleted = item.markIds.size;
                const pbdCompleted = item.pbdIds.size;
                const completeBoth = Math.min(markCompleted, pbdCompleted);
                const percent = total > 0 ? Math.round((completeBoth / total) * 100) : 0;
                let status = 'BELUM MULA';
                if (completeBoth > 0 && completeBoth < total) status = 'SEBAHAGIAN';
                if (total > 0 && markCompleted >= total && pbdCompleted >= total) status = 'SIAP';
                return { ...item, total, markCompleted, pbdCompleted, completeBoth, percent, status };
            }).sort((a, b) => {
                return (a.kelas + a.subject + a.assessment).localeCompare(b.kelas + b.subject + b.assessment);
            });
        }

        function normalizeEmail(value) {
            return cleanEmail(value);
        }

        function getAllowedGuruKelasClasses() {
            const currentEmail = normalizeEmail(currentUser?.email || '');

            // Jika kelas telah dimuat melalui login/refresh, kunci terus kepada kelas itu sahaja.
            if (currentUser?.kelas) {
                return [{
                    kelas: currentUser.kelas,
                    tahun: String(currentUser.kelas || '').charAt(0),
                    guru_kelas: currentUser.guruKelas || '-',
                    pembantu: currentUser.pembantuGuru || '-'
                }];
            }

            // Keutamaan: padanan emel daripada jadual Supabase class_teachers.
            // Emel tidak dipaparkan dalam dashboard. Ia hanya digunakan untuk kawalan akses.
            const rowsFromSupabase = (classTeacherRows || []).filter(item => {
                const guruEmail = normalizeEmail(item.guru_email || item.guru_kelas_email);
                const pembantuEmail = normalizeEmail(item.pembantu_email);
                return currentEmail && (guruEmail === currentEmail || pembantuEmail === currentEmail);
            }).map(item => ({
                kelas: item.kelas,
                tahun: item.tahun,
                guru_kelas: item.guru_kelas,
                pembantu: item.pembantu || item.pembantu_guru || '-'
            }));

            if (rowsFromSupabase.length > 0) {
                return rowsFromSupabase;
            }

            return [];
        }

        function getVerificationForClass(kelasName, jenis) {
            return (classVerificationRows || []).find(row =>
                isSameClassOnly(row.kelas, kelasName) &&
                String(row.tahun) === String(selectedYear) &&
                row.assessment === selectedAssessment &&
                row.jenis === jenis
            );
        }

        function getClassCompletionSummary(kelasName) {
            const classStudents = getStudentsByExactClass(kelasName);
            const totalStudents = classStudents.length;
            const subjectList = getSubjectsForClass(kelasName);
            let completedSubjects = 0;
            let partialSubjects = 0;
            let totalFilled = 0;

            subjectList.forEach(sub => {
                const combinedRows = [ ...(markStatusRows || []), ...(pbdStatusRows || []) ];
                const filled = new Set(combinedRows.filter(row =>
                    isSameClassOnly(row.kelas, kelasName) &&
                    row.subject === sub &&
                    row.assessment === selectedAssessment &&
                    String(row.tahun) === String(selectedYear)
                ).map(row => String(row.student_id))).size;

                totalFilled += filled;
                if (totalStudents > 0 && filled >= totalStudents) completedSubjects++;
                else if (filled > 0) partialSubjects++;
            });

            const totalRequired = totalStudents * subjectList.length;
            const percent = totalRequired > 0 ? Math.round((totalFilled / totalRequired) * 100) : 0;
            return { totalStudents, subjectCount: subjectList.length, completedSubjects, partialSubjects, totalFilled, totalRequired, percent };
        }

        function getSubjectsForClass(kelasName) {
            const yearLevel = parseInt(String(kelasName || '').charAt(0), 10) || 1;
            const tahap1 = ['BAHASA MELAYU', 'BAHASA INGGERIS', 'MATEMATIK', 'SAINS', 'PENDIDIKAN ISLAM', 'BAHASA ARAB', 'PENDIDIKAN SENI VISUAL', 'PENDIDIKAN JASMANI DAN KESIHATAN', 'MUZIK'];
            const tahap2 = [...tahap1, 'SEJARAH', 'REKA BENTUK TEKNOLOGI'];
            return yearLevel <= 3 ? tahap1 : tahap2;
        }

        async function submitClassVerification(jenis) {
            if (!supabaseEnabled || !supabaseClient) {
                showToast('Supabase belum disambungkan.', 'danger');
                return;
            }
            if (!guruKelasSelectedClass) {
                showToast('Sila pilih kelas terlebih dahulu.', 'warning');
                return;
            }

            const payload = {
                kelas: guruKelasSelectedClass,
                tahun: String(selectedYear),
                assessment: selectedAssessment,
                jenis,
                guru_kelas: currentUser?.name || 'Guru Kelas',
                guru_email: currentUser?.email || null,
                status: 'Menunggu Semakan Admin',
                tarikh: new Date().toISOString()
            };

            try {
                const { data: existingRows, error: findError } = await supabaseClient
                    .from('semakan_guru_kelas')
                    .select('id')
                    .eq('kelas', payload.kelas)
                    .eq('tahun', payload.tahun)
                    .eq('assessment', payload.assessment)
                    .eq('jenis', payload.jenis)
                    .limit(1);

                if (findError) throw findError;

                if (existingRows && existingRows.length > 0) {
                    const { error: updateError } = await supabaseClient
                        .from('semakan_guru_kelas')
                        .update(payload)
                        .eq('id', existingRows[0].id);
                    if (updateError) throw updateError;
                } else {
                    const { error: insertError } = await supabaseClient
                        .from('semakan_guru_kelas')
                        .insert(payload);
                    if (insertError) throw insertError;
                }

                await fetchAllDataFromSupabase();
                showToast(`${jenis} ${guruKelasSelectedClass} telah dihantar ke Dashboard Admin.`, 'success');
                renderPage();
            } catch (e) {
                console.error('Gagal hantar pengesahan guru kelas:', e);
                showToast('Gagal hantar pengesahan. Pastikan jadual semakan_guru_kelas dan RLS betul.', 'danger');
            }
        }

        // --- SUB-TABS INTERACTIVE HANDLERS ---
        function changeAnalysisMode(mode) {

        function viewStudentPerformance(sId) {
            analysisSelectedStudentId = sId;

        function updateRowGrade(inputElem) {
            const row = inputElem.closest('.student-row');
            const score = inputElem.value.trim();
            const label = row.querySelector('.grade-label');
            const calculated = calculateUASAGrade(score);
            
            label.className = `grade-label inline-block px-3 py-1 rounded-full font-bold text-[10px] border ${calculated.color}`;
            label.innerText = `${calculated.grade} (${calculated.label})`;
        }


        function getSubjectStudentCountForYear(yearNum) {
            return students.filter(s => String(s.kelas || '').startsWith(String(yearNum) + ' ')).length;
        }

        function calculateGradeStatsForYear(yearNum, subject, assessmentName) {
            const activeStudents = students.filter(s => String(s.kelas || '').startsWith(String(yearNum) + ' '));
            const stats = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, total: activeStudents.length, filled: 0 };
            activeStudents.forEach(st => {
                const key = `${st.id}_${analysisSelectedAcademicYearPBD}_${assessmentName}_${subject}`;
                const raw = studentMarks[key];
                if (raw !== undefined && raw !== null && raw !== '') {
                    const grade = calculateUASAGrade(raw).grade;
                    if (stats[grade] !== undefined) {
                        stats[grade]++;
                        stats.filled++;
                    }
                }
            });
            return stats;
        }

        function renderGradeCells(stats) {
            const denominator = stats.total || 1;
            return ['A', 'B', 'C', 'D', 'E', 'F'].map(g => {
                const bil = stats[g] || 0;
                const pct = ((bil / denominator) * 100).toFixed(2);
                return `<td>${bil}</td><td>${pct}</td>`;
            }).join('');
        }

        function wrapSubjectName(subject) {
            return String(subject || '').split(' ').map(w => w.length > 10 ? w.slice(0, 10) + '<br>' + w.slice(10) : w).join('<br>');
        }

        function cloneGradeStats() {
            return { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, total: 0, filled: 0 };
        }

        function addGradeStats(target, source) {
            ['A', 'B', 'C', 'D', 'E', 'F'].forEach(g => target[g] += (source[g] || 0));
            target.total += (source.total || 0);
            target.filled += (source.filled || 0);
        }

        function renderSumatifGradeReport() {
            const yearsList = ['1', '2', '3', '4', '5', '6'];
            const selectedAssessmentForReport = analysisSelectedAssessment || 'PENTAKSIRAN SUMATIF 1';
            let grand = cloneGradeStats();

            const reportRows = baseSubjects.map(subject => {
                const subjectTotal = cloneGradeStats();
                const yearRows = yearsList.map((yr, idx) => {
                    const stats = calculateGradeStatsForYear(yr, subject, selectedAssessmentForReport);
                    addGradeStats(subjectTotal, stats);
                    addGradeStats(grand, stats);

                    return `

                        </div>

                        <div class="p-4 bg-slate-100 rounded-2xl border border-blue-100/50 space-y-2">
                            <div class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center font-extrabold text-sm mb-2">${student.nama.charAt(0)}</div>
                            <h4 class="font-bold text-slate-800 text-xs">${student.nama}</h4>
                            <p class="text-[10px] text-slate-500 font-semibold">${student.ic}</p>
                            <p class="text-[10px] text-blue-700 font-extrabold bg-blue-50 inline-block px-2.5 py-0.5 rounded-full">${student.kelas}</p>
                        </div>
                    </div>

                    <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-blue-100 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-800 text-sm">Profil Akademik Pentaksiran UASA & PBD</h3>
                        <div class="overflow-y-auto max-h-[300px] border border-slate-100 rounded-2xl">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-100 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                                        <th class="p-3">Mata Pelajaran</th>
                                        <th class="p-3 text-center">Markah</th>
                                        <th class="p-3 text-center">Gred</th>
                                        <th class="p-3 text-center">PBD TP</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${subjectsToUse.map(sub => {
                                        const key = `${student.id}_${selectedYear}_${analysisSelectedAssessment}_${sub}`;
                                        const score = studentMarks[key];
                                        const pbdVal = studentPBD[key] || '-';
                                        const gradeRes = calculateUASAGrade(score);

                                        return `
                                            <tr>
                                                <td class="p-3 font-bold text-slate-700">${sub}</td>
                                                <td class="p-3 text-center font-bold text-slate-800">${score !== undefined ? score + '%' : '-'}</td>
                                                <td class="p-3 text-center">
                                                    <span class="inline-block px-2 py-0.5 rounded-full font-bold text-[9px] border ${gradeRes.color}">${gradeRes.grade}</span>
                                                </td>
                                                <td class="p-3 text-center"><span class="font-extrabold text-purple-600 bg-purple-50 px-2.5 py-0.5 rounded-full text-[9px]">${pbdVal}</span></td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- PERFORMANCE / RENDER FOR PBD RINGKASAN ---
        function renderAnalysisPBD() {
            return `
                <div class="bg-white p-6 rounded-2xl border border-blue-100 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-sm">Ringkasan Analisis Tahap Penguasaan (TP) PBD</h3>
                    <p class="text-xs text-slate-500 font-medium">Berdasarkan data pentaksiran yang disimpan, berikut adalah statistik purata pencapaian TP bagi kelas ${selectedClass}:</p>
                    <div class="grid grid-cols-2 md:grid-cols-6 gap-3 pt-3">
                        ${['TP1','TP2','TP3','TP4','TP5','TP6'].map((tp, idx) => {
                            const count = Object.values(studentPBD).filter(v => v === tp).length;
                            return `
                                <div class="p-4 border border-slate-100/80 bg-slate-50/30 rounded-2xl text-center space-y-1">
                                    <span class="text-xs font-bold text-blue-600">${tp}</span>
                                    <h4 class="text-xl font-black text-slate-800">${count}</h4>
                                    <p class="text-[9px] text-slate-400 font-bold uppercase">Subjek Murid</p>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // --- WINDOW BOOTSTRAP ---
        window.onload = async function() {
            await initSupabase();
            lucide.createIcons();
            renderPage();
        };
    </script> 
     <script>
   (function() {
    'use strict';

    // 1. PENGURUSAN KLIK KANAN (CONTEXT MENU)
    document.addEventListener('contextmenu', function(e) {
        // Hanya benarkan klik kanan jika berada di dalam elemen '.dalam-sistem'
        if (e.target.closest('.dalam-sistem')) {
            return true; 
        } else {
            e.preventDefault(); // Lock bahagian lain secara senyap
        }
    });

    // 2. PENGURUSAN PINTASAN PAPAN KEKUNCI (KEYBOARD)
    document.addEventListener('keydown', function(e) {
        const isDalamSistem = e.target.closest('.dalam-sistem');

        // LOCK fungsi salin (Ctrl+C / Ctrl+X) jika pengguna berada di LUAR sistem
        if (!isDalamSistem && (e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'x')) {
            e.preventDefault();
            return false;
        }

        // LOCK GLOBAL (Sentiasa sekat Inspect Element & View Source di mana-mana bahagian pun)
        if ((e.ctrlKey || e.metaKey) && e.key === 'u') { // Ctrl+U (View Source)
            e.preventDefault();
            return false;
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 's') { // Ctrl+S (Save Page)
            e.preventDefault();
            return false;
        }
        if ( // F12 & Ctrl+Shift+I/J/C (Inspect Element)
            e.key === 'F12' || 
            ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))
        ) {
            e.preventDefault();
            return false;
        }
    });

    // 3. ANTI-DEBUGGER dinyahaktifkan kerana loop rekursif menyebabkan fungsi login tersekat.

})();
    </script>
