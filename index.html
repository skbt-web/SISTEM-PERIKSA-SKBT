        function normalizeTeacherName(value) {
            return String(value || '')
                .toUpperCase()
                .replace(/\b(PN|PUAN|EN|ENCIK|CIK|HJH|HJ|BT|BIN|BINTI)\.?\b/g, '')
                .replace(/[^A-Z0-9]/g, '')
                .trim();
        }


        // Padanan kelas yang selamat.
        // Tujuan: Setiap kelas diproses secara berasingan.
        // Contoh: 4 AR-RAZI tidak bercampur dengan 4 AL-KHAWARIZMI.
        // Data lama yang ada beza tanda '-' atau jarak masih boleh dibaca.
        function normalizeClassName(value) {
            return String(value || '')
                .toUpperCase()
                .replace(/AL\s*-?\s*KHAWARIZMI/g, 'AL KHAWARIZMI')
                .replace(/AR\s*-?\s*RAZI/g, 'AR RAZI')
                .replace(/[^A-Z0-9]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function getClassYearOnly(value) {
            const match = normalizeClassName(value).match(/^(\d+)/);
            return match ? match[1] : '';
        }

        function getClassStreamOnly(value) {
            const normalized = normalizeClassName(value);

            if (/(^|\s)AL\s+KHAWARIZMI($|\s)/.test(normalized)) {
                return 'AL KHAWARIZMI';
            }

            if (/(^|\s)AR\s+RAZI($|\s)/.test(normalized)) {

            return '';

            const hasArRazi = /(^|\s)AR\s+RAZI($|\s)/.test(normalized);
            return hasAlKhawarizmi && hasArRazi;
        }

        function isSameClassOnly(value, targetClass) {
            if (!value || !targetClass) return false;
            if (containsMultipleClasses(value)) return false;

            const valueClass = normalizeClassName(value);
            const targetClassName = normalizeClassName(targetClass);

            // Padanan kelas dibuat secara tepat supaya 4 AL-KHAWARIZMI tidak bercampur dengan 4 AR-RAZI.
            // Tanda sempang dan jarak masih dibenarkan kerana normalizeClassName sudah menyeragamkannya.
            return valueClass === targetClassName;
        }

        function canonicalClassName(value) {
            const normalized = normalizeClassName(value);
            const match = classes.find(c => normalizeClassName(c) === normalized);
            return match || String(value || '').toUpperCase().trim();
        }

        // Penapis roster kelas yang ketat.

        function getStudentsByExactClass(kelasName) {
            const targetClass = canonicalClassName(kelasName);

            const seen = new Set();

            let roster = [];

                    if (!key) return true;
                    if (seen.has(key)) return false;

        async function initSupabase() {
            try {
                if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('PASTE_')) {
                    console.warn('Supabase URL / Anon Key belum lengkap. Sistem berjalan dalam mod tempatan.');
                    supabaseEnabled = false;
                    return;
                }

                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                });

                supabaseEnabled = true;

                // Jangan ambil data sebelum login kerana RLS hanya benarkan pengguna authenticated.
                const { data: sessionData } = await supabaseClient.auth.getSession();
                if (sessionData && sessionData.session) {
                    await fetchAllDataFromSupabase();
                }

                console.log('Supabase initialized successfully');
            } catch (e) {
                supabaseEnabled = false;
                console.error('Supabase connection error:', e);
            }
        }

        async function fetchAllDataFromSupabase() {
            if (!supabaseEnabled || !supabaseClient) return;
            try {
                const { data: studentRows, error: studentError } = await supabaseClient
                    .from('students')
                    .select('id,nama,ic,kelas')
                    .order('kelas', { ascending: true })
                    .order('nama', { ascending: true });

                if (studentError) throw studentError;
                if (studentRows && studentRows.length > 0) {
                    students.length = 0;
                    studentRows.forEach(row => {
                        students.push({
                            id: row.id,
                            nama: row.nama,
                            ic: row.ic,
                            kelas: row.kelas
                        });
                    });
                }

                const { data: markRows, error: markError } = await supabaseClient
                    .from('marks')
                    .select('key,value,student_id,tahun,assessment,subject,teacher_email,teacher_name,kelas,updated_at');
                if (markError) throw markError;
                if (markRows) {
                    const cachedMarks = readCachedAssessmentRows(SISMAR_MARK_CACHE_KEY, 'MARKAH');
                    markStatusRows = mergeAssessmentRows(markRows, cachedMarks, 'MARKAH');
                    cacheAssessmentRows(SISMAR_MARK_CACHE_KEY, markStatusRows);

                    .from('pbd')
                    .select('key,value,student_id,tahun,assessment,subject,teacher_email,teacher_name,kelas,updated_at');
                if (pbdError) throw pbdError;
                if (pbdRows) {
                    const cachedPbd = readCachedAssessmentRows(SISMAR_PBD_CACHE_KEY, 'PBD');
                    pbdStatusRows = mergeAssessmentRows(pbdRows, cachedPbd, 'PBD');
                    cacheAssessmentRows(SISMAR_PBD_CACHE_KEY, pbdStatusRows);
                }

                rebuildAssessmentMaps();

                // Direktori guru untuk pembetulan Admin. Emel digunakan secara dalaman sahaja dan tidak dipaparkan.
                try {

                        ic: student.ic,
                        kelas: student.kelas,
                        tahun: getStudentYear(student.kelas),

        // --- PENGIRAAN STATISTIK PBD AUTOMATIK ---
        function calculatePBDStatsForYear(yearNum) {
            const result = {};
            const activeStudents = students.filter(s => s.kelas.startsWith(yearNum + ' '));

            baseSubjects.forEach(sub => {
                result[sub] = {
                    'AL-KHAWARIZMI': { TP1: 0, TP2: 0, TP3: 0, TP4: 0, TP5: 0, TP6: 0, Total: 0 },
                    'AR-RAZI': { TP1: 0, TP2: 0, TP3: 0, TP4: 0, TP5: 0, TP6: 0, Total: 0 },
                    'JUMLAH': { TP1: 0, TP2: 0, TP3: 0, TP4: 0, TP5: 0, TP6: 0, Total: 0 }
                };

                activeStudents.forEach(s => {
                    const classKey = getClassStreamOnly(s.kelas).replace('AL KHAWARIZMI', 'AL-KHAWARIZMI').replace('AR RAZI', 'AR-RAZI');
                    const key = `${s.id}_${analysisSelectedAcademicYearPBD}_${analysisSelectedAssessment}_${sub}`;
                    const tp = studentPBD[key];

                    if (tp && ['TP1', 'TP2', 'TP3', 'TP4', 'TP5', 'TP6'].includes(tp)) {
                        result[sub][classKey][tp]++;
                        result[sub][classKey].Total++;
                        result[sub]['JUMLAH'][tp]++;
                        result[sub]['JUMLAH'].Total++;
                    }
                });
            });

            return result;
        }

        // --- FUNGSI JANA RUMUSAN AUTOMATIK ---
        function generateAutomaticSummary(stats) {
            let bestSubject = '-';
            let bestScore = -1;
            let weakestSubject = '-';
            let weakestScore = 9999;

            baseSubjects.forEach(sub => {
                const data = stats[sub]['JUMLAH'];
                if (data.Total > 0) {
                    const menguasai = data.TP3 + data.TP4 + data.TP5 + data.TP6;
                    const pct = (menguasai / data.Total) * 100;
                    if (pct > bestScore) {
                        bestScore = pct;
                        bestSubject = sub;
                    }
                    if (pct < weakestScore) {
                        weakestScore = pct;
                        weakestSubject = sub;
                    }
                }
            });

            if (bestScore === -1) bestSubject = "Tiada Data";
            if (weakestScore === 9999) weakestSubject = "Tiada Data";

            return {
                bestSubject,
                weakestSubject,
                bestClass: "1 AR-RAZI",
                interventionClass: "1 AL-KHAWARIZMI",
                suggestions: [
                    "Menjalankan bimbingan berfokus (PLC) bagi subjek " + (weakestSubject !== "Tiada Data" ? weakestSubject : "yang dikenal pasti lemah") + ".",
                    "Memantapkan pelaksanaan aktiviti interaktif dan intervensi dalam bilik darjah.",
                    "Sesi perkongsian amalan terbaik di antara guru pentaksir subjek utama."
                ]
            };
        }

        function getCurrentTeacherMarkRowsFromScreen() {

                    return;
                }

                const headerInfo = [

                    ['Mata Pelajaran', selectedSubject],
                    ['Guru Pentaksir', selectedTeacher],

                const tableHeader = ['Bil', 'Nama Murid', 'No. MyKad', 'Markah', 'Gred', 'Tahap', 'PBD'];
                const csvLines = [];

                headerInfo.forEach(line => csvLines.push(line.map(csvSafe).join(',')));
                csvLines.push(tableHeader.map(csvSafe).join(','));
                rows.forEach(r => {
                    csvLines.push([r.bil, r.nama, r.ic, r.markah, r.gred, r.tahap, r.pbd].map(csvSafe).join(','));
                });

                const blob = new Blob(['\ufeff' + csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });

        // --- GRADES MATH ---
        function calculateUASAGrade(score) {
            if (score === null || score === undefined || score === '') {
                return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
            }
            const num = parseFloat(score);
            if (num >= 82 && num <= 100) return { grade: 'A', color: 'text-blue-700 bg-blue-50 border-blue-200', label: 'CEMERLANG' };
            if (num >= 66 && num <= 81) return { grade: 'B', color: 'text-cyan-700 bg-cyan-50 border-cyan-200', label: 'KEPUJIAN' };
            if (num >= 50 && num <= 65) return { grade: 'C', color: 'text-amber-700 bg-amber-50 border-amber-200', label: 'MEMUASKAN' };
            if (num >= 35 && num <= 49) return { grade: 'D', color: 'text-orange-700 bg-orange-50 border-orange-200', label: 'MENCAPAI TAHAP MINIMUM' };
            if (num >= 1 && num <= 34) return { grade: 'E', color: 'text-rose-700 bg-rose-50 border-rose-200', label: 'BELUM MENCAPAI TAHAP MINIMUM' };
            if (num === 0) return { grade: 'F', color: 'text-red-700 bg-red-100 border-red-300', label: 'TIDAK MENGUASAI' };
            return { grade: '-', color: 'text-gray-400 bg-gray-50 border-gray-100', label: 'Belum Dinilai' };
        }

        // --- SUBMIT AND PERSIST ASSESSMENT ---
        async function saveMarks(silent = false) {
            const rows = document.querySelectorAll('.student-row');
            let successCount = 0;
            const markRows = [];
            const pbdRows = [];

            for (const row of rows) {
                const sId = row.getAttribute('data-id');
                const markInput = row.querySelector('.mark-input');
                const pbdSelect = row.querySelector('.pbd-select');
                const key = `${sId}_${selectedYear}_${selectedAssessment}_${selectedSubject}`;
                const keyInfo = parseKey(key);

                if (markInput) {
                    const markVal = markInput.value.trim();

                    if (markVal === '') {
                        delete studentMarks[key];
                    } else {
                        const num = parseFloat(markVal);
                        if (!isNaN(num) && num >= 0 && num <= 100) {
                            studentMarks[key] = num;
                            markRows.push({
                                key,
                                student_id: String(keyInfo.student_id),
                                tahun: keyInfo.tahun,
                                assessment: keyInfo.assessment,
                                subject: keyInfo.subject,
                                value: num,
                                teacher_email: currentUser ? currentUser.email : null,
                                teacher_name: selectedTeacher,
                                kelas: canonicalClassName(selectedClass),
                                updated_at: new Date().toISOString()
                            });
                            successCount++;
                        }
                    }

                    if (pbdSelect) {
                        const pbdVal = pbdSelect.value;
                        if (pbdVal) {
                            studentPBD[key] = pbdVal;
                            pbdRows.push({
                                key,
                                student_id: String(keyInfo.student_id),
                                tahun: keyInfo.tahun,
                                assessment: keyInfo.assessment,
                                subject: keyInfo.subject,
                                value: pbdVal,
                                teacher_email: currentUser ? currentUser.email : null,
                                teacher_name: selectedTeacher,
                                kelas: canonicalClassName(selectedClass),
                                updated_at: new Date().toISOString()
                            });
                        } else {
                            delete studentPBD[key];
                        }
                    }
                }
            }

            // Kemas kini status tempatan dahulu supaya Dashboard Guru Kelas terus nampak markah
            // walaupun Supabase lambat refresh atau RLS tidak memulangkan row kepada akaun semasa.
            markStatusRows = mergeAssessmentRows(markStatusRows, markRows, 'MARKAH');
            pbdStatusRows = mergeAssessmentRows(pbdStatusRows, pbdRows, 'PBD');
            cacheAssessmentRows(SISMAR_MARK_CACHE_KEY, markStatusRows);
            cacheAssessmentRows(SISMAR_PBD_CACHE_KEY, pbdStatusRows);
            rebuildAssessmentMaps();

            const saved = await persistMarksBulkToSupabase(markRows, pbdRows);
            if (saved) {
                await fetchAllDataFromSupabase();
            }

            if (!silent) {
                showToast(`Selesai menyimpan ${successCount} rekod prestasi. Markah dipulihkan dalam paparan Dashboard Guru Kelas.`, 'success');
            }
            renderPage();
        }

        // --- CSV LOADING AND PROCESSING ---
        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = text.split('\n');
                tempUploadedStudents = [];

                for (let i = 1; i < rows.length; i++) {
                    const columns = rows[i].split(',');
                    if (columns.length >= 3) {
                        const nama = columns[0].trim().toUpperCase();
                        const ic = columns[1].trim();
                        const kelas = canonicalClassName(columns[2].trim());

                        if (nama && ic && kelas) {
                            tempUploadedStudents.push({ nama, ic, kelas });
                        }
                    }
                }

                const infoBox = document.getElementById('csv-preview-info');
                if (infoBox) {
                    infoBox.innerText = `Menjumpai ${tempUploadedStudents.length} murid sedia untuk diimport.`;
                    infoBox.classList.remove('hidden');
                }
                showToast(`Selesai memuat fail. Sila klik SIMPAN untuk memasukkannya ke sistem.`, 'info');
            };
            reader.readAsText(file);
        }

        async function saveCSVData() {
            if (tempUploadedStudents.length === 0) {
                showToast('Tiada data fail CSV dikesan. Sila pilih fail terlebih dahulu.', 'warning');
                return;
            }

            let importCount = 0;
            const startId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;

            for (let i = 0; i < tempUploadedStudents.length; i++) {
                const row = tempUploadedStudents[i];
                const exists = students.some(s => s.ic === row.ic);
                
                if (!exists) {
                    const studentObj = {
                        id: startId + importCount,
                        nama: row.nama,
                        ic: row.ic,
                        kelas: row.kelas
                    };
                    students.push(studentObj);
                    importCount++;
                }
            }

            const newStudentsForUpload = students.slice(students.length - importCount);
            await persistStudentsBulkToSupabase(newStudentsForUpload);

            tempUploadedStudents = [];
            const infoBox = document.getElementById('csv-preview-info');
            if (infoBox) {
                infoBox.classList.add('hidden');
            }
            const csvInput = document.getElementById('csv-file-input');
            if (csvInput) csvInput.value = '';

            showToast(`Berjaya mendaftar ${importCount} murid baharu ke sistem & Supabase!`, 'success');
            renderPage();
        }

        function buildFillingStatusRows(scope = 'admin', classFilter = null) {
            const grouped = {};
            const allRows = [
                ...(markStatusRows || []).map(row => ({ ...row, data_type: 'MARKAH' })),
                ...(pbdStatusRows || []).map(row => ({ ...row, data_type: 'PBD' }))
            ];

            const filteredRows = allRows.filter(row => {
                if (!row) return false;
                if (selectedYear && String(row.tahun) !== String(selectedYear)) return false;
                if (selectedAssessment && row.assessment !== selectedAssessment) return false;
                if (classFilter && !isSameClassOnly(row.kelas, classFilter)) return false;
                if (containsMultipleClasses(row.kelas)) return false;
                return true;
            });

            filteredRows.forEach(row => {
                const kelasName = canonicalClassName(row.kelas || '-');
                const subjectName = row.subject || '-';
                const teacherName = row.teacher_name || row.teacher_email || '-';
                const teacherEmail = cleanEmail(row.teacher_email || '');
                const assessmentName = row.assessment || '-';
                const tahunName = row.tahun || selectedYear;
                const key = [tahunName, assessmentName, normalizeClassName(kelasName), subjectName, teacherEmail || normalizeTeacherName(teacherName)].join('||');

                if (!grouped[key]) {
                    grouped[key] = {
                        tahun: tahunName,
                        assessment: assessmentName,
                        kelas: kelasName,
                        subject: subjectName,
                        teacher_name: teacherName,
                        teacher_email: row.teacher_email || '-',
                        markStudentIds: new Set(),
                        pbdStudentIds: new Set(),
                        allStudentIds: new Set(),
                        updated_at: row.updated_at || row.tarikh || null
                    };
                }

                if (row.student_id) {
                    grouped[key].allStudentIds.add(String(row.student_id));
                    if (row.data_type === 'MARKAH') grouped[key].markStudentIds.add(String(row.student_id));
                    if (row.data_type === 'PBD') grouped[key].pbdStudentIds.add(String(row.student_id));
                }

                const rowDate = row.updated_at || row.tarikh || null;
                if (rowDate && (!grouped[key].updated_at || new Date(rowDate) > new Date(grouped[key].updated_at))) {
                    grouped[key].updated_at = rowDate;
                }
            });

            const result = Object.values(grouped).map(item => {
                const total = getClassStudentCount(item.kelas);
                const markCompleted = item.markStudentIds.size;
                const pbdCompleted = item.pbdStudentIds.size;
                const completed = Math.min(markCompleted, pbdCompleted);
                const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
                let status = 'BELUM MULA';
                if ((markCompleted > 0 || pbdCompleted > 0) && completed < total) status = 'SEBAHAGIAN';
                if (total > 0 && markCompleted >= total && pbdCompleted >= total) status = 'SIAP';
                return { ...item, total, completed, markCompleted, pbdCompleted, percent, status };
            });

            return result.sort((a, b) => {
                return (a.kelas + a.subject + a.teacher_name).localeCompare(b.kelas + b.subject + b.teacher_name);
            });
        }

        async function updateRowsForTable(tableName, oldPayload, newPayload) {
            const oldEmail = cleanEmail(oldPayload.teacher_email);
            let query = supabaseClient
                .from(tableName)
                .select('student_id,tahun,assessment,subject,kelas,teacher_email,teacher_name')
                .eq('tahun', String(oldPayload.tahun))
                .eq('assessment', oldPayload.assessment)
                .eq('subject', oldPayload.subject)
                .eq('kelas', oldPayload.kelas);

            if (oldEmail && oldEmail !== '-') {
                query = query.eq('teacher_email', oldEmail);
            } else {
                query = query.eq('teacher_name', oldPayload.teacher_name);
            }

            const { data: rows, error: selectError } = await query;
            if (selectError) throw selectError;
            if (!rows || rows.length === 0) return 0;

            let updatedCount = 0;
            for (const row of rows) {
                const newKey = `${row.student_id}_${newPayload.tahun}_${newPayload.assessment}_${newPayload.subject}`;
                let updateQuery = supabaseClient
                    .from(tableName)
                    .update({
                        key: newKey,
                        tahun: String(newPayload.tahun),
                        assessment: newPayload.assessment,
                        subject: newPayload.subject,
                        kelas: newPayload.kelas,
                        teacher_name: newPayload.teacher_name,
                        teacher_email: newPayload.teacher_email || oldPayload.teacher_email || null,
                        updated_at: new Date().toISOString()
                    })
                    .eq('student_id', String(row.student_id))
                    .eq('tahun', String(oldPayload.tahun))
                    .eq('assessment', oldPayload.assessment)
                    .eq('subject', oldPayload.subject)
                    .eq('kelas', oldPayload.kelas);

                const rowEmail = cleanEmail(row.teacher_email || oldPayload.teacher_email);
                if (rowEmail && rowEmail !== '-') {
                    updateQuery = updateQuery.eq('teacher_email', rowEmail);
                } else {
                    updateQuery = updateQuery.eq('teacher_name', oldPayload.teacher_name);
                }

                const { error: updateError } = await updateQuery;
                if (updateError) throw updateError;
                updatedCount++;
            }
            return updatedCount;
        }

        function getAssessmentMarkValue(studentId, tahun, assessment, subject) {
            const key = makeAssessmentKey(studentId, tahun, assessment, subject);
            if (studentMarks[key] !== undefined && studentMarks[key] !== null && studentMarks[key] !== '') {
                return studentMarks[key];
            }

            const row = (markStatusRows || []).find(r =>
                String(r.student_id) === String(studentId) &&
                String(r.tahun) === String(tahun) &&
                String(r.assessment) === String(assessment) &&
                String(r.subject) === String(subject) &&
                r.value !== null && r.value !== undefined && r.value !== ''
            );

            return row ? row.value : '';
        }

        function getAssessmentPBDValue(studentId, tahun, assessment, subject) {
            const key = makeAssessmentKey(studentId, tahun, assessment, subject);
            if (studentPBD[key] !== undefined && studentPBD[key] !== null && studentPBD[key] !== '') {
                return studentPBD[key];
            }

            const row = (pbdStatusRows || []).find(r =>
                String(r.student_id) === String(studentId) &&
                String(r.tahun) === String(tahun) &&
                String(r.assessment) === String(assessment) &&
                String(r.subject) === String(subject) &&
                r.value !== null && r.value !== undefined && r.value !== ''
            );

            return row ? row.value : '';
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        function getSlipStudent() {
            return students.find(s => String(s.id) === String(slipSelectedStudentId)) || students[0] || null;
        }

        function getSlipGender(ic) {
            const digits = String(ic || '').replace(/\D/g, '');
            if (!digits) return '-';
            const last = parseInt(digits.charAt(digits.length - 1), 10);
            if (Number.isNaN(last)) return '-';
            return last % 2 === 0 ? 'PEREMPUAN' : 'LELAKI';
        }

        function getSlipMark(studentId, subject) {
            const key = `${studentId}_${slipSelectedYear}_${slipSelectedAssessment}_${subject}`;
            if (studentMarks[key] !== undefined && studentMarks[key] !== null && studentMarks[key] !== '') return studentMarks[key];
            const row = (markStatusRows || []).find(r =>
                String(r.student_id) === String(studentId) &&
                String(r.tahun) === String(slipSelectedYear) &&
                r.assessment === slipSelectedAssessment &&
                r.subject === subject
            );
            return row ? row.value : '';
        }

        function getSlipGrade(mark) {
            if (mark === '' || mark === null || mark === undefined) return 'E';
            const num = parseFloat(mark);
            if (Number.isNaN(num)) return 'E';
            return calculateUASAGrade(num).grade;
        }

        function getSlipTitle() {
            if (slipSelectedAssessment === 'UJIAN AKHIR SESI AKADEMIK (UASA)') {
                return `${slipSelectedAssessment} ${slipSelectedYear}`;

            return `${slipSelectedAssessment} ${slipSelectedYear}`;
        }

        function getStudentTotalForSlip(student) {
            if (!student) return { total: 0, percent: 0, numericCount: 0 };
            const subjectsForSlip = getSlipSubjectsForStudent(student);
            let total = 0;
            let numericCount = 0;
            subjectsForSlip.forEach(subject => {
                const mark = getSlipMark(student.id, subject);
                const num = parseFloat(mark);
                if (!Number.isNaN(num)) {
                    total += num;
                    numericCount++;
                }
            });
            const percent = subjectsForSlip.length > 0 ? (total / (subjectsForSlip.length * 100)) * 100 : 0;
            return { total, percent, numericCount };
        }

        function getSlipClassRank(student) {
            if (!student) return '-';
            const classmates = getStudentsByExactClass(student.kelas);
            const scores = classmates.map(s => ({ id: s.id, total: getStudentTotalForSlip(s).total }))
                .sort((a, b) => b.total - a.total);
            const index = scores.findIndex(s => String(s.id) === String(student.id));
            return index >= 0 ? index + 1 : '-';
        }

        function normalizeName(value) {
            return String(value || '').trim().toUpperCase();
        }

        function getTeacherOwnStatusRows() {
            const guruName = normalizeName(currentUser?.name);
            const guruEmail = String(currentUser?.email || '').trim().toLowerCase();
            const grouped = {};

            function shouldInclude(row) {
                if (!row) return false;
                const rowEmail = String(row.teacher_email || '').trim().toLowerCase();
                const rowTeacher = normalizeName(row.teacher_name);
                if (guruEmail && rowEmail === guruEmail) return true;
                if (guruName && rowTeacher === guruName) return true;
                return false;
            }

            function ensureGroup(row) {
                const tahunName = row.tahun || selectedYear;
                const assessmentName = row.assessment || selectedAssessment;
                const kelasName = row.kelas || '-';
                const subjectName = row.subject || '-';
                const teacherName = row.teacher_name || currentUser?.name || '-';
                const key = [tahunName, assessmentName, kelasName, subjectName].join('||');

                if (!grouped[key]) {
                    grouped[key] = {
                        tahun: tahunName,
                        assessment: assessmentName,
                        kelas: kelasName,
                        subject: subjectName,
                        teacher_name: teacherName,
                        teacher_email: row.teacher_email || currentUser?.email || '-',
                        markIds: new Set(),
                        pbdIds: new Set(),
                        updated_at: row.updated_at || null
                    };
                }

                if (row.updated_at && (!grouped[key].updated_at || new Date(row.updated_at) > new Date(grouped[key].updated_at))) {
                    grouped[key].updated_at = row.updated_at;
                }

                return grouped[key];
            }

            (markStatusRows || []).filter(shouldInclude).forEach(row => {
                const g = ensureGroup(row);
                if (row.student_id && row.value !== null && row.value !== undefined && row.value !== '') {
                    g.markIds.add(String(row.student_id));
                }
            });

            (pbdStatusRows || []).filter(shouldInclude).forEach(row => {
                const g = ensureGroup(row);
                if (row.student_id && row.value !== null && row.value !== undefined && row.value !== '') {
                    g.pbdIds.add(String(row.student_id));
                }
            });

            return Object.values(grouped).map(item => {
                const total = getClassStudentCount(item.kelas);
                const markCompleted = item.markIds.size;
                const pbdCompleted = item.pbdIds.size;
                const completeBoth = Math.min(markCompleted, pbdCompleted);
                const percent = total > 0 ? Math.round((completeBoth / total) * 100) : 0;
                let status = 'BELUM MULA';
                if (completeBoth > 0 && completeBoth < total) status = 'SEBAHAGIAN';
                if (total > 0 && markCompleted >= total && pbdCompleted >= total) status = 'SIAP';
                return { ...item, total, markCompleted, pbdCompleted, completeBoth, percent, status };
            }).sort((a, b) => {
                return (a.kelas + a.subject + a.assessment).localeCompare(b.kelas + b.subject + b.assessment);
            });
        }

        // --- PEMULIHAN MARKAH SISMAR ---
        // Cache ini tidak mengubah struktur asal. Ia hanya melindungi markah yang sudah diisi
        // daripada hilang pada paparan Dashboard Guru Kelas jika bacaan Supabase lambat, RLS terhad,
        // atau column key lama kosong.
        const SISMAR_MARK_CACHE_KEY = 'sismar_mark_rows_cache_v1';
        const SISMAR_PBD_CACHE_KEY = 'sismar_pbd_rows_cache_v1';

        function makeAssessmentKey(studentId, tahun, assessment, subject) {
            return `${studentId}_${tahun}_${assessment}_${subject}`;
        }

        function normalizeSavedRow(row, type = 'MARKAH') {
            if (!row) return null;
            const parsed = row.key ? parseKey(row.key) : {};
            const studentId = String(row.student_id || parsed.student_id || '').trim();
            const tahun = String(row.tahun || parsed.tahun || selectedYear || '').trim();
            const assessment = row.assessment || parsed.assessment || selectedAssessment || '';
            const subject = row.subject || parsed.subject || selectedSubject || '';
            if (!studentId || !tahun || !assessment || !subject) return null;
            return {
                ...row,
                key: row.key || makeAssessmentKey(studentId, tahun, assessment, subject),
                student_id: studentId,
                tahun,
                assessment,
                subject,
                value: row.value,
                teacher_email: row.teacher_email || (currentUser ? currentUser.email : null),
                teacher_name: row.teacher_name || selectedTeacher || '-',
                kelas: canonicalClassName(row.kelas || selectedClass || ''),
                updated_at: row.updated_at || new Date().toISOString(),
                data_type: type
            };
        }

        function cacheAssessmentRows(storageKey, rows) {
            try {
                const existing = JSON.parse(localStorage.getItem(storageKey) || '[]');
                const merged = {};
                existing.concat(rows || []).forEach(item => {
                    const row = normalizeSavedRow(item, storageKey === SISMAR_MARK_CACHE_KEY ? 'MARKAH' : 'PBD');
                    if (!row) return;
                    const k = [row.student_id, row.tahun, row.assessment, row.subject].join('||');
                    merged[k] = row;
                });
                localStorage.setItem(storageKey, JSON.stringify(Object.values(merged)));
            } catch (e) {
                console.warn('Cache markah tidak dapat dikemas kini:', e);
            }
        }

        function readCachedAssessmentRows(storageKey, type = 'MARKAH') {
            try {
                return (JSON.parse(localStorage.getItem(storageKey) || '[]') || [])
                    .map(row => normalizeSavedRow(row, type))
                    .filter(Boolean);
            } catch (e) {
                return [];
            }
        }

        function mergeAssessmentRows(primaryRows, cachedRows, type = 'MARKAH') {
            const merged = {};
            (cachedRows || []).concat(primaryRows || []).forEach(item => {
                const row = normalizeSavedRow(item, type);
                if (!row) return;
                const k = [row.student_id, row.tahun, row.assessment, row.subject].join('||');
                merged[k] = row;
            });
            return Object.values(merged);
        }

        function rebuildAssessmentMaps() {
            Object.keys(studentMarks).forEach(k => delete studentMarks[k]);
            (markStatusRows || []).forEach(row => {
                const fixed = normalizeSavedRow(row, 'MARKAH');
                if (fixed && fixed.key && fixed.value !== null && fixed.value !== undefined && fixed.value !== '') {
                    studentMarks[fixed.key] = fixed.value;
                }
            });

            Object.keys(studentPBD).forEach(k => delete studentPBD[k]);
            (pbdStatusRows || []).forEach(row => {
                const fixed = normalizeSavedRow(row, 'PBD');
                if (fixed && fixed.key && fixed.value !== null && fixed.value !== undefined && fixed.value !== '') {
                    studentPBD[fixed.key] = fixed.value;
                }
            });
        }

        function getVerificationForClass(kelasName, jenis) {
            return (classVerificationRows || []).find(row =>
                isSameClassOnly(row.kelas, kelasName) &&

            );

        function getClassCompletionSummary(kelasName) {
            const classStudents = getStudentsByExactClass(kelasName);
            const totalStudents = classStudents.length;
            const subjectList = getSubjectsForClass(kelasName);
            let completedSubjects = 0;
            let partialSubjects = 0;
            let totalFilled = 0;

            subjectList.forEach(sub => {
                const combinedRows = [ ...(markStatusRows || []), ...(pbdStatusRows || []) ];
                const filled = new Set(combinedRows.filter(row =>
                    isSameClassOnly(row.kelas, kelasName) &&
                    row.subject === sub &&
                    row.assessment === selectedAssessment &&
                    String(row.tahun) === String(selectedYear)
                ).map(row => String(row.student_id))).size;

                totalFilled += filled;
                if (totalStudents > 0 && filled >= totalStudents) completedSubjects++;
                else if (filled > 0) partialSubjects++;
            });

            const totalRequired = totalStudents * subjectList.length;
            const percent = totalRequired > 0 ? Math.round((totalFilled / totalRequired) * 100) : 0;
            return { totalStudents, subjectCount: subjectList.length, completedSubjects, partialSubjects, totalFilled, totalRequired, percent };
        }

        function getSubjectsForClass(kelasName) {
            const yearLevel = parseInt(String(kelasName || '').charAt(0), 10) || 1;

            const tahap2 = [...tahap1, 'SEJARAH', 'REKA BENTUK TEKNOLOGI'];
            return yearLevel <= 3 ? tahap1 : tahap2;
        }

            if (!guruKelasSelectedClass) {
                showToast('Sila pilih kelas terlebih dahulu.', 'warning');

            const payload = {

                jenis,
                guru_kelas: currentUser?.name || 'Guru Kelas',
                guru_email: currentUser?.email || null,

                tarikh: new Date().toISOString()
            };

            try {
                const { data: existingRows, error: findError } = await supabaseClient
                    .from('semakan_guru_kelas')
                    .select('id')
                    .eq('kelas', payload.kelas)
                    .eq('tahun', payload.tahun)
                    .eq('assessment', payload.assessment)
                    .eq('jenis', payload.jenis)
                    .limit(1);

                if (findError) throw findError;

                if (existingRows && existingRows.length > 0) {
                    const { error: updateError } = await supabaseClient
                        .from('semakan_guru_kelas')
                        .update(payload)
                        .eq('id', existingRows[0].id);
                    if (updateError) throw updateError;
                } else {
                    const { error: insertError } = await supabaseClient
                        .from('semakan_guru_kelas')
                        .insert(payload);
                    if (insertError) throw insertError;
                }

                await fetchAllDataFromSupabase();
                showToast(`${jenis} ${guruKelasSelectedClass} telah dihantar ke Dashboard Admin.`, 'success');
                renderPage();

                console.error('Gagal hantar pengesahan guru kelas:', e);
                showToast('Gagal hantar pengesahan. Pastikan jadual semakan_guru_kelas dan RLS betul.', 'danger');

        // --- SISMAR AI ENGINE ---
        // Struktur asal dikekalkan. Modul ini hanya membaca data sedia ada dan memaparkan analisis.
        let sismarAISelectedMode = 'sekolah';
        let sismarAIResult = '';

        function getStudentSubjectMarks(studentId, year = selectedYear, assessment = selectedAssessment) {
            return baseSubjects.map(subject => {
                const key = `${studentId}_${year}_${assessment}_${subject}`;
                const mark = studentMarks[key];
                const pbd = studentPBD[key] || '';
                return {
                    subject,
                    mark: mark === undefined || mark === '' ? null : Number(mark),
                    pbd
                };
            });
        }

        function getStudentAverageAI(studentId, year = selectedYear, assessment = selectedAssessment) {
            const marks = getStudentSubjectMarks(studentId, year, assessment).filter(item => Number.isFinite(item.mark));
            if (marks.length === 0) return 0;
            return marks.reduce((sum, item) => sum + item.mark, 0) / marks.length;
        }

        function getStudentRiskAI(student, year = selectedYear, assessment = selectedAssessment) {
            const average = getStudentAverageAI(student.id, year, assessment);
            const subjectRows = getStudentSubjectMarks(student.id, year, assessment);
            const lowSubjects = subjectRows.filter(item => Number.isFinite(item.mark) && item.mark < 40).map(item => item.subject);
            const lowTP = subjectRows.filter(item => ['TP1', 'TP2'].includes(item.pbd)).map(item => item.subject);

            if (average > 0 && (average < 40 || lowSubjects.length >= 2 || lowTP.length >= 2)) {
                return {
                    tahap: 'Risiko Tinggi',
                    badge: 'bg-rose-100 text-rose-700 border-rose-200',
                    cadangan: 'Intervensi segera, bimbingan kumpulan kecil dan pemantauan mingguan.',
                    sebab: lowSubjects.length ? `Markah rendah dalam ${lowSubjects.slice(0, 3).join(', ')}.` : 'Tahap penguasaan masih rendah.'
                };
            }

            if (average > 0 && (average < 60 || lowSubjects.length === 1 || lowTP.length === 1)) {
                return {
                    tahap: 'Risiko Sederhana',
                    badge: 'bg-amber-100 text-amber-700 border-amber-200',
                    cadangan: 'Latihan pengukuhan, semakan latihan dan ujian semula selepas dua minggu.',
                    sebab: lowSubjects.length ? `Perlu pengukuhan dalam ${lowSubjects.slice(0, 3).join(', ')}.` : 'Prestasi belum stabil.'
                };
            }

            return {
                tahap: average === 0 ? 'Belum Cukup Data' : 'Risiko Rendah',
                badge: average === 0 ? 'bg-slate-100 text-slate-600 border-slate-200' : 'bg-emerald-100 text-emerald-700 border-emerald-200',
                cadangan: average === 0 ? 'Lengkapkan markah dan TP sebelum analisis penuh dibuat.' : 'Teruskan latihan pengayaan dan soalan aras tinggi.',
                sebab: average === 0 ? 'Data markah belum mencukupi.' : 'Prestasi stabil.'
            };
        }

        function getSismarAISnapshot() {
            const rows = students.map(s => {
                const average = getStudentAverageAI(s.id);
                const risk = getStudentRiskAI(s);
                return {
                    id: s.id,
                    nama: s.nama,
                    kelas: s.kelas,
                    purata: Number(average.toFixed(1)),
                    risiko: risk.tahap,
                    sebab: risk.sebab,
                    cadangan: risk.cadangan,
                    subjects: getStudentSubjectMarks(s.id).filter(item => item.mark !== null || item.pbd)
                };
            });

            const withMarks = rows.filter(r => r.purata > 0);
            const schoolAverage = withMarks.length ? withMarks.reduce((sum, r) => sum + r.purata, 0) / withMarks.length : 0;
            const highRisk = rows.filter(r => r.risiko === 'Risiko Tinggi');
            const mediumRisk = rows.filter(r => r.risiko === 'Risiko Sederhana');
            const lowRisk = rows.filter(r => r.risiko === 'Risiko Rendah');

            const subjectStats = baseSubjects.map(subject => {
                const values = students.map(s => {
                    const key = `${s.id}_${selectedYear}_${selectedAssessment}_${subject}`;
                    const mark = studentMarks[key];
                    return mark === undefined || mark === '' ? null : Number(mark);
                }).filter(v => Number.isFinite(v));
                const avg = values.length ? values.reduce((a, b) => a + b, 0) / values.length : 0;
                return { subject, average: Number(avg.toFixed(1)), count: values.length };
            }).filter(x => x.count > 0).sort((a, b) => a.average - b.average);

            return {
                tahun: selectedYear,
                assessment: selectedAssessment,
                jumlahMurid: students.length,
                jumlahDataMarkah: withMarks.length,
                purataSekolah: Number(schoolAverage.toFixed(1)),
                risikoTinggi: highRisk,
                risikoSederhana: mediumRisk,
                risikoRendah: lowRisk,
                subjectStats,
                murid: rows
            };
        }

        function buildLocalSismarAIResponse(mode, question, snapshot) {
            const weakest = snapshot.subjectStats[0];
            const best = snapshot.subjectStats[snapshot.subjectStats.length - 1];
            const riskList = [...snapshot.risikoTinggi, ...snapshot.risikoSederhana].slice(0, 10);
            const riskText = riskList.length ? riskList.map((m, i) => `${i + 1}. ${m.nama} (${m.kelas}) - ${m.risiko}, purata ${m.purata}%. ${m.cadangan}`).join('\n') : 'Tiada murid berisiko berdasarkan data semasa.';

            if (mode === 'intervensi') {
                return `PELAN INTERVENSI AI\n\nFokus utama: ${weakest ? weakest.subject : 'Belum cukup data'}\nMurid sasaran:\n${riskText}\n\nCadangan tindakan:\n1. Jalankan diagnostik topik bagi subjek lemah.\n2. Bentuk kumpulan kecil mengikut tahap risiko.\n3. Beri latihan berfokus selama dua minggu.\n4. Semak semula markah dan TP selepas intervensi.\n5. Maklumkan perkembangan kepada guru kelas dan ibu bapa.`;
            }

            if (mode === 'ibu_bapa') {
                const first = riskList[0];
                if (!first) return 'Laporan ibu bapa belum dapat dijana kerana tiada murid berisiko berdasarkan data semasa.';
                return `LAPORAN RINGKAS IBU BAPA\n\nPrestasi ${first.nama} berada pada tahap ${first.risiko}. Purata semasa ialah ${first.purata}%.\n\n${first.sebab}\n\nCadangan kepada ibu bapa:\n1. Bantu anak membuat ulang kaji sekurang-kurangnya 20 minit sehari.\n2. Pantau latihan yang diberikan oleh guru.\n3. Beri galakan positif dan hadirkan anak ke sesi intervensi.\n\nTerima kasih atas kerjasama tuan/puan.`;
            }

            if (mode === 'subjek') {
                return `ANALISIS SUBJEK AI\n\nSubjek terbaik: ${best ? best.subject + ' dengan purata ' + best.average + '%' : '-'}\nSubjek memerlukan perhatian: ${weakest ? weakest.subject + ' dengan purata ' + weakest.average + '%' : '-'}\n\nCadangan:\n1. Kenal pasti topik yang paling banyak menyebabkan markah rendah.\n2. Laksanakan latihan pengukuhan untuk murid bawah 60%.\n3. Gunakan aktiviti pemulihan untuk murid TP1 dan TP2.\n4. Sediakan soalan pengayaan untuk murid cemerlang.`;
            }

            if (mode === 'kelas') {
                return `ANALISIS KELAS AI\n\nTahun pentaksiran: ${snapshot.tahun}\nPentaksiran: ${snapshot.assessment}\nPurata keseluruhan: ${snapshot.purataSekolah}%\n\nRisiko tinggi: ${snapshot.risikoTinggi.length} murid\nRisiko sederhana: ${snapshot.risikoSederhana.length} murid\nRisiko rendah: ${snapshot.risikoRendah.length} murid\n\nSenarai tumpuan:\n${riskText}`;
            }

            if (mode === 'chat') {
                return `JAWAPAN AI\n\nSoalan: ${question || 'Murid mana perlu intervensi segera?'}\n\n${riskText}\n\nCadangan utama: fokus kepada murid risiko tinggi dahulu, kemudian jalankan pemulihan berfokus untuk subjek paling lemah iaitu ${weakest ? weakest.subject : 'belum dikenal pasti'}.`;
            }

            return `RINGKASAN AI GURU BESAR\n\nJumlah murid: ${snapshot.jumlahMurid}\nMurid dengan data markah: ${snapshot.jumlahDataMarkah}\nPurata keseluruhan: ${snapshot.purataSekolah}%\n\nRisiko tinggi: ${snapshot.risikoTinggi.length} murid\nRisiko sederhana: ${snapshot.risikoSederhana.length} murid\nRisiko rendah: ${snapshot.risikoRendah.length} murid\n\nSubjek terbaik: ${best ? best.subject + ' (' + best.average + '%)' : '-'}\nSubjek lemah: ${weakest ? weakest.subject + ' (' + weakest.average + '%)' : '-'}\n\nCadangan pentadbiran:\n1. Pantau murid risiko tinggi secara mingguan.\n2. Minta guru subjek menyediakan intervensi berfokus.\n3. Semak perkembangan selepas dua minggu.\n4. Gunakan laporan ini untuk mesyuarat kurikulum dan perbincangan bersama guru kelas.`;
        }

        async function runSismarAI() {
            const output = document.getElementById('sismar-ai-output');
            const btn = document.getElementById('sismar-ai-run-btn');
            const modeEl = document.getElementById('sismar-ai-mode');
            const questionEl = document.getElementById('sismar-ai-question');
            const mode = modeEl ? modeEl.value : sismarAISelectedMode;
            const question = questionEl ? questionEl.value.trim() : '';
            const snapshot = getSismarAISnapshot();

            if (output) output.innerText = 'SISMAR AI sedang menjana analisis...';
            if (btn) btn.disabled = true;

            try {
                if (supabaseEnabled && supabaseClient) {
                    const { data, error } = await supabaseClient.functions.invoke('sismar-ai', {
                        body: {
                            jenis: mode,
                            soalan: question,
                            data: snapshot
                        }
                    });

                    if (!error && data && (data.result || data.text || data.output)) {
                        sismarAIResult = data.result || data.text || data.output;
                    } else {
                        sismarAIResult = buildLocalSismarAIResponse(mode, question, snapshot);
                    }
                } else {
                    sismarAIResult = buildLocalSismarAIResponse(mode, question, snapshot);
                }
            } catch (err) {
                console.warn('Gemini/Supabase Edge Function belum tersedia. Guna analisis tempatan.', err);
                sismarAIResult = buildLocalSismarAIResponse(mode, question, snapshot);
            }

            if (output) output.innerText = sismarAIResult;
            if (btn) btn.disabled = false;
            showToast('Analisis SISMAR AI berjaya dijana.', 'success');
        }

        function copySismarAIResult() {
            const text = sismarAIResult || document.getElementById('sismar-ai-output')?.innerText || '';
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => showToast('Analisis AI telah disalin.', 'success'));
        }

        function readResourceLinks(storageKey) {
            try {
                const value = JSON.parse(localStorage.getItem(storageKey) || '{}');
                return value && typeof value === 'object' ? value : {};
            } catch (e) {
                console.warn('Pautan modul tidak dapat dibaca:', e);
                return {};
            }
        }

        function cacheResourceLinks(storageKey, links) {
            try {
                localStorage.setItem(storageKey, JSON.stringify(links || {}));
            } catch (e) {
                console.warn('Cache pautan tidak dapat disimpan:', e);
            }
        }

        async function loadResourceLinksFromSupabase(type, force = false) {
            const storageKey = type === 'bank' ? SISMAR_BANK_LINKS_KEY : SISMAR_REKOD_LINKS_KEY;
            if (!force && (resourceLinksLoaded[type] || resourceLinksLoading[type])) return;
            if (!supabaseEnabled || !supabaseClient || !currentUser) return;

            resourceLinksLoading[type] = true;
            try {
                const { data, error } = await supabaseClient
                    .from(SISMAR_RESOURCE_TABLE)
                    .select('resource_type,subject,url,updated_at')
                    .eq('resource_type', type)
                    .order('subject', { ascending: true });

                if (error) throw error;

                const links = {};
                (data || []).forEach(row => {
                    if (row.subject && row.url) links[row.subject] = row.url;
                });
                cacheResourceLinks(storageKey, links);
                resourceLinksLoaded[type] = true;

                if ((type === 'bank' && currentPage === 'bank_soalan') ||
                    (type === 'rekod' && currentPage === 'rekod_perkembangan_murid')) {
                    renderSubjectResourcePage(type);
                    lucide.createIcons();
                }
            } catch (e) {
                console.error('Gagal mengambil pautan daripada Supabase:', e);
                // Kekalkan cache tempatan supaya paparan dan pautan tidak hilang.
                showToast('Pautan Supabase belum dapat dibaca. Cache tempatan masih digunakan.', 'warning');
            } finally {
                resourceLinksLoading[type] = false;
            }
        }

        async function saveResourceLink(storageKey, subject, inputId) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const url = String(input.value || '').trim();
            if (url && !/^https?:\/\//i.test(url)) {
                showToast('Pautan mesti bermula dengan http:// atau https://', 'warning');
                return;
            }

            const type = getResourceTypeFromStorageKey(storageKey);
            const links = readResourceLinks(storageKey);
            const previousUrl = links[subject] || '';

            // Simpan cache dahulu agar pautan kekal walaupun rangkaian terputus.
            if (url) links[subject] = url;
            else delete links[subject];
            cacheResourceLinks(storageKey, links);

            if (!supabaseEnabled || !supabaseClient) {
                showToast('Pautan disimpan dalam peranti. Sambungan Supabase tidak tersedia.', 'warning');
                renderSubjectResourcePage(type);
                lucide.createIcons();
                return;
            }

            try {
                if (url) {
                    const authResult = await supabaseClient.auth.getUser();
                    const userEmail = authResult?.data?.user?.email || currentUser?.email || '';
                    const { error } = await supabaseClient
                        .from(SISMAR_RESOURCE_TABLE)
                        .upsert({
                            resource_type: type,
                            subject,
                            url,
                            updated_by: userEmail,
                            updated_at: new Date().toISOString()
                        }, { onConflict: 'resource_type,subject' });
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient
                        .from(SISMAR_RESOURCE_TABLE)
                        .delete()
                        .eq('resource_type', type)
                        .eq('subject', subject);
                    if (error) throw error;
                }

                resourceLinksLoaded[type] = true;
                showToast(`Pautan ${subject} telah disimpan ke Supabase.`, 'success');
            } catch (e) {
                console.error('Gagal simpan pautan ke Supabase:', e);
                // Pulihkan cache kepada nilai lama supaya status skrin tepat.
                if (previousUrl) links[subject] = previousUrl;
                else delete links[subject];
                cacheResourceLinks(storageKey, links);
                showToast('Gagal simpan ke Supabase. Pautan asal dikekalkan.', 'danger');
            }

            renderSubjectResourcePage(type);
            lucide.createIcons();
        }

            const label = row.querySelector('.grade-label');
            const calculated = calculateUASAGrade(score);
            
            label.className = `grade-label inline-block px-3 py-1 rounded-full font-bold text-[10px] border ${calculated.color}`;
            label.innerText = `${calculated.grade} (${calculated.label})`;
        }


        function getSubjectStudentCountForYear(yearNum) {
            return students.filter(s => String(s.kelas || '').startsWith(String(yearNum) + ' ')).length;
        }

        function calculateGradeStatsForYear(yearNum, subject, assessmentName) {
            const activeStudents = students.filter(s => String(s.kelas || '').startsWith(String(yearNum) + ' '));
            const stats = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, total: activeStudents.length, filled: 0 };
            activeStudents.forEach(st => {
                const key = `${st.id}_${analysisSelectedAcademicYearPBD}_${assessmentName}_${subject}`;
                const raw = studentMarks[key];
                if (raw !== undefined && raw !== null && raw !== '') {
                    const grade = calculateUASAGrade(raw).grade;
                    if (stats[grade] !== undefined) {
                        stats[grade]++;
                        stats.filled++;
                    }
                }
            });
            return stats;
        }

        function renderGradeCells(stats) {
            const denominator = stats.total || 1;
            return ['A', 'B', 'C', 'D', 'E', 'F'].map(g => {
                const bil = stats[g] || 0;
                const pct = ((bil / denominator) * 100).toFixed(2);
                return `<td>${bil}</td><td>${pct}</td>`;
            }).join('');
        }

        function wrapSubjectName(subject) {
            return String(subject || '').split(' ').map(w => w.length > 10 ? w.slice(0, 10) + '<br>' + w.slice(10) : w).join('<br>');
        }

        function cloneGradeStats() {
            return { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, total: 0, filled: 0 };
        }

        function addGradeStats(target, source) {
            ['A', 'B', 'C', 'D', 'E', 'F'].forEach(g => target[g] += (source[g] || 0));
            target.total += (source.total || 0);
            target.filled += (source.filled || 0);
        }

                                                    <td>${ar.TP3}</td><td>${((ar.TP3/arTot)*100).toFixed(1)}%</td>
                                                    <td>${ar.TP4}</td><td>${((ar.TP4/arTot)*100).toFixed(1)}%</td>
                                                    <td>${ar.TP5}</td><td>${((ar.TP5/arTot)*100).toFixed(1)}%</td>
                                                    <td>${ar.TP6}</td><td>${((ar.TP6/arTot)*100).toFixed(1)}%</td>
                                                    <td class="font-bold">${ar.Total}</td>
                                                </tr>
                                                <tr class="excel-bg-blue-total font-bold">
                                                    <td></td>
                                                    <td class="text-left pl-3">JUMLAH</td>
                                                    <td>${j.TP1}</td><td>${((j.TP1/jTot)*100).toFixed(1)}%</td>
                                                    <td>${j.TP2}</td><td>${((j.TP2/jTot)*100).toFixed(1)}%</td>
                                                    <td>${j.TP3}</td><td>${((j.TP3/jTot)*100).toFixed(1)}%</td>
                                                    <td>${j.TP4}</td><td>${((j.TP4/jTot)*100).toFixed(1)}%</td>
                                                    <td>${j.TP5}</td><td>${((j.TP5/jTot)*100).toFixed(1)}%</td>
                                                    <td>${j.TP6}</td><td>${((j.TP6/jTot)*100).toFixed(1)}%</td>
                                                    <td>${j.Total}</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- PRESTASI INDIVIDU & RINGKASAN ORIGINAL ---
        function renderAnalysisIndividu() {
            const student = students.find(s => s.id == analysisSelectedStudentId) || students[0];
            if (!student) {
                return `<div class="p-6 bg-white border rounded-2xl text-center text-xs font-bold text-slate-400">Tiada data murid untuk dianalisis.</div>`;
            }

            const subjectsToUse = baseSubjects;

            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl border border-blue-100 shadow-sm space-y-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Pilih Murid</label>
                            <select onchange="analysisSelectedStudentId=this.value; renderPage()" class="w-full p-2.5 border border-gray-100 rounded-xl text-xs font-bold text-slate-700 outline-none focus:ring-1 focus:ring-blue-500">
                                ${students.map(s => `<option value="${s.id}" ${s.id==analysisSelectedStudentId?'selected':''}>${s.nama} (${s.kelas})</option>`).join('')}
                            </select>
                        </div>

                        <div class="p-4 bg-slate-100 rounded-2xl border border-blue-100/50 space-y-2">
                            <div class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center font-extrabold text-sm mb-2">${student.nama.charAt(0)}</div>
                            <h4 class="font-bold text-slate-800 text-xs">${student.nama}</h4>
                            <p class="text-[10px] text-slate-500 font-semibold">${student.ic}</p>
                            <p class="text-[10px] text-blue-700 font-extrabold bg-blue-50 inline-block px-2.5 py-0.5 rounded-full">${student.kelas}</p>
                        </div>
                    </div>

                    <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-blue-100 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-800 text-sm">Profil Akademik Pentaksiran UASA & PBD</h3>
                        <div class="overflow-y-auto max-h-[300px] border border-slate-100 rounded-2xl">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-100 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                                        <th class="p-3">Mata Pelajaran</th>
                                        <th class="p-3 text-center">Markah</th>
                                        <th class="p-3 text-center">Gred</th>
                                        <th class="p-3 text-center">PBD TP</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${subjectsToUse.map(sub => {
                                        const key = `${student.id}_${selectedYear}_${analysisSelectedAssessment}_${sub}`;
                                        const score = studentMarks[key];
                                        const pbdVal = studentPBD[key] || '-';
                                        const gradeRes = calculateUASAGrade(score);

                                        return `
                                            <tr>
                                                <td class="p-3 font-bold text-slate-700">${sub}</td>
                                                <td class="p-3 text-center font-bold text-slate-800">${score !== undefined ? score + '%' : '-'}</td>
                                                <td class="p-3 text-center">
                                                    <span class="inline-block px-2 py-0.5 rounded-full font-bold text-[9px] border ${gradeRes.color}">${gradeRes.grade}</span>
                                                </td>
                                                <td class="p-3 text-center"><span class="font-extrabold text-purple-600 bg-purple-50 px-2.5 py-0.5 rounded-full text-[9px]">${pbdVal}</span></td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- PERFORMANCE / RENDER FOR PBD RINGKASAN ---
        function renderAnalysisPBD() {
            return `
                <div class="bg-white p-6 rounded-2xl border border-blue-100 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-sm">Ringkasan Analisis Tahap Penguasaan (TP) PBD</h3>
                    <p class="text-xs text-slate-500 font-medium">Berdasarkan data pentaksiran yang disimpan, berikut adalah statistik purata pencapaian TP bagi kelas ${selectedClass}:</p>
                    <div class="grid grid-cols-2 md:grid-cols-6 gap-3 pt-3">
                        ${['TP1','TP2','TP3','TP4','TP5','TP6'].map((tp, idx) => {
                            const count = Object.values(studentPBD).filter(v => v === tp).length;
                            return `
                                <div class="p-4 border border-slate-100/80 bg-slate-50/30 rounded-2xl text-center space-y-1">
                                    <span class="text-xs font-bold text-blue-600">${tp}</span>
                                    <h4 class="text-xl font-black text-slate-800">${count}</h4>
                                    <p class="text-[9px] text-slate-400 font-bold uppercase">Subjek Murid</p>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // --- WINDOW BOOTSTRAP ---
        window.onload = async function() {
            await initSupabase();
            lucide.createIcons();
            renderPage();
        };
    </script> 
</body>
</html>
